  .show > *{position:relative;}
  .brand{display:flex;align-items:center;}
  .brand svg{width:132px;height:auto;display:block;}
  .brand svg path{fill:#162660;}
  :root[data-theme="dark"] .brand svg path{fill:#FFFFFF;}

  /* the placeholder: swap this block for a real image */
  .shot{
    flex:1;margin:26px 0;border-radius:16px;border:1px dashed var(--line-strong);
    background:rgba(255,255,255,.55);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--ink-faint);text-align:center;padding:24px;
  }
  :root[data-theme="dark"] .shot{background:rgba(255,255,255,.04);}
  .shot b{font-size:15px;font-weight:600;color:var(--ink-soft);}
  .shot span{font-size:13.5px;}
  .shot img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block;}

  .show h2{margin:0;font-size:27px;line-height:1.25;font-weight:700;letter-spacing:-.02em;max-width:15ch;}
  .show p.k{margin:8px 0 0;font-size:15px;color:var(--ink-soft);max-width:34ch;}

  /* ---------- right: the form ---------- */
  .form{display:flex;align-items:center;justify-content:center;padding:40px 30px;}
  .form-in{width:100%;max-width:372px;}
  h1{margin:0 0 4px;font-size:30px;font-weight:700;letter-spacing:-.02em;}
  .sub{margin:0 0 26px;color:var(--ink-soft);font-size:15px;}

  label{display:block;font-size:13.5px;font-weight:700;color:var(--ink-soft);margin:0 0 6px;}
  .field{margin-bottom:16px;}
  .inp{position:relative;display:flex;align-items:center;}
  input{
    width:100%;height:50px;padding:0 14px;font-family:inherit;font-size:15.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--line-strong);border-radius:11px;outline:none;
    transition:border-color .12s, box-shadow .12s;
  }
  :root[data-theme="dark"] input{background:var(--wash);}
  input::placeholder{color:var(--ink-faint);}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);}
  input[aria-invalid="true"]{border-color:var(--crit);}
  .peek{
    position:absolute;right:6px;width:40px;height:40px;border:0;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);border-radius:9px;
  }
  .peek:hover{color:var(--ink);background:var(--wash);}
  .peek svg{width:22px;height:22px;}
  input[type="password"],input[data-pw]{padding-right:52px;}

  .row{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 22px;}
  .remember{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--ink-soft);cursor:pointer;}
  .remember input{width:auto;height:auto;}
  .link{font-size:14.5px;font-weight:600;color:var(--ink);text-decoration:none;}
  .link:hover{text-decoration:underline;}

  .go{
    width:100%;height:52px;border:0;border-radius:12px;cursor:pointer;
    background:var(--ink-dark);color:var(--panel);
    font-family:inherit;font-size:16px;font-weight:700;
  }
  :root[data-theme="dark"] .go{color:#000;}
  .go:hover{filter:brightness(1.12);}
  .go:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .err{
    display:none;margin:0 0 16px;padding:10px 13px;border-radius:10px;
    background:var(--crit-wash);color:var(--crit);font-size:14.5px;font-weight:600;
  }
  .err.on{display:block;}
  .foot{margin:22px 0 0;font-size:14.5px;color:var(--ink-faint);text-align:center;}
  .foot a{color:var(--ink);font-weight:700;text-decoration:none;}
  .foot a:hover{text-decoration:underline;}

  .build-stamp{position:fixed;left:8px;bottom:4px;font-size:10px;color:rgba(23,24,28,.30);pointer-events:none;}
  :root[data-theme="dark"] .build-stamp{color:rgba(255,255,255,.28);}

  /* one column when there is no room for two */
  @media (max-width: 900px){
    .shell{grid-template-columns:1fr;min-height:0;}
    .show{min-height:260px;}
    .shot{min-height:150px;}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}

  /* ---------- the left panel is now footage ---------- */
  .show{padding:30px;justify-content:space-between;}
  .show-bg{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    /* the source is letterboxed: white bars top and bottom inside a 16:9
       frame. Scaling past the edges pushes them out of the crop. */
    transform:scale(1.3);transform-origin:center;
    pointer-events:none;
  }
  .show-scrim{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(8,14,26,.66) 0%, rgba(8,14,26,.40) 9%, rgba(8,14,26,.10) 30%,
      rgba(8,14,26,.55) 72%, rgba(8,14,26,.82) 100%);
  }
  .show::before{display:none;}           /* the watermark gives way to the footage */
  .brand svg path{fill:#FFFFFF;}
  :root[data-theme="dark"] .brand svg path{fill:#FFFFFF;}
  /* white mark over moving footage: the scrim carries it, this insures it */
  .show .brand svg{filter:drop-shadow(0 1px 10px rgba(8,14,26,.55));}

  /* ---------- the value proposition, one at a time ---------- */
  .vp{color:#fff;}
  .vp-eyebrow{
    margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.04em;
    color:rgba(255,255,255,.72);
  }
  /* the line leaves through the top and the next one arrives from below,
     so the set reads as one strip rolling upward rather than a cross-fade */
  .vp-line,.vp-sub{
    opacity:0;transform:translateY(18px);
    transition:opacity .32s ease, transform .38s cubic-bezier(.22,.7,.3,1);
  }
  .vp-line{
    margin:0;font-size:29px;line-height:1.22;font-weight:700;letter-spacing:-.02em;
    max-width:17ch;min-height:2.44em;
  }
  .vp-sub{
    margin:10px 0 0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.80);
    max-width:36ch;min-height:2.9em;
    transition-delay:.05s;
  }
  .vp.in .vp-line,.vp.in .vp-sub{opacity:1;transform:none;}
  .vp.out .vp-line,.vp.out .vp-sub{opacity:0;transform:translateY(-18px);}
  /* the return to the starting point below must be a jump, not a journey —
     tweened, it would carry the line down through the panel in full view */
  .vp.noanim .vp-line,.vp.noanim .vp-sub{transition:none;}
  /* the strip is clipped so a line is never caught half outside the panel */
  .vp{overflow:hidden;}
  .vp-dots{display:flex;gap:6px;margin-top:18px;}
  .vp-dots i{
    width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.34);
    transition:background .3s ease;
  }
  .vp-dots i.on{background:#fff;}

  @media (prefers-reduced-motion: reduce){
    .vp-line,.vp-sub{opacity:1;transform:none;transition:none;}
  }
</style>

  if(!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t='dark';

var pw = document.getElementById('pw'), peek = document.getElementById('peek');
peek.addEventListener('click', function(){

  pw.type = shown ? 'password' : 'text';
  peek.innerHTML = shown ? EYE : EYE_OFF;
  peek.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');

});

/* Demo door: any input, or none at all, opens the portal. Validation is
   deliberately off so nobody has to type credentials to get to the thing
   being reviewed. Nothing is sent — there is no credential handling here. */
var f = document.getElementById('f');
f.addEventListener('submit', function(e){
  e.preventDefault();
  window.location.href = 'simplecare-physician-portal-lofi.html';
});


/* ===== value propositions, one at a time =====
   Each line is something the product actually does, not a slogan — a
   claim on a login screen that the portal behind it does not honour is
   worse than no claim. */
var VALUE_PROPS = [
  {line:'Your whole day on one screen.',
   sub:'Alerts, the live queue and your claims, in the order they need you.'},
  {line:'Critical results reach you before your first call.',
   sub:'Graded against the LifeLabs British Columbia standard, not by guesswork.'},
  {line:'The queue follows the clock, so you do not have to.',
   sub:'It moves with your call windows and holds anyone carried over from earlier.'},
  {line:'Patients wait at home, not in a waiting room.',
   sub:'They book a call window and hold a place in line. You phone them.'},
  {line:'Claims travel with the visit.',
   sub:'Billing sits on the day sheet, beside the patient it belongs to.'}
];

var vpI = 0, vpTimer = null;
var vpLine = document.getElementById('vp-line');
var vpSub  = document.getElementById('vp-sub');
var vpWrap = document.querySelector('.vp');
var vpDots = document.getElementById('vp-dots');

function vpPaint(){
  var v = VALUE_PROPS[vpI];
  vpLine.textContent = v.line;
  vpSub.textContent  = v.sub;
  [].forEach.call(vpDots.children, function(d, n){ d.classList.toggle('on', n === vpI); });
  vpWrap.classList.add('in');
}
function vpNext(){
  if(document.hidden) return;                  /* nothing moves on a tab nobody is looking at */
  vpWrap.classList.add('out');                 /* current line rises and fades */
  vpWrap.classList.remove('in');
  setTimeout(function(){
    vpI = (vpI + 1) % VALUE_PROPS.length;
    vpWrap.classList.add('noanim');            /* snap, don't slide, back to the start */
    vpWrap.classList.remove('out');            /* now parked below the panel, unseen */
    vpPaint();                                 /* new words, still out of sight */
    void vpWrap.offsetHeight;                  /* commit that before re-enabling the tween */
    vpWrap.classList.remove('noanim');
    vpWrap.classList.add('in');                /* and it rises into place from below */
  }, 380);
}
(function vpStart(){
  VALUE_PROPS.forEach(function(){ vpDots.appendChild(document.createElement('i')); });
  vpPaint();
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!still) vpTimer = setInterval(vpNext, 5200);
})();

/* Reduced motion means the footage holds on its poster frame rather than
   playing. It is decoration; it should never be the reason someone cannot
   use the page. */
(function(){
  var v = document.getElementById('bg');

  if(p && p.catch) p.catch(function(){});
