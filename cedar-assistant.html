<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cedar assistant</title>
<meta name="description" content="Cedar, Simple's clinical assistant: ask questions of one patient's record, with every answer sourced and every action left to the physician.">
<!--
  Cedar, standalone (Ani, 20 Nov 2026). Plans changed: Cedar is shown as a standalone assistant with one patient open, not a
  walkthrough of the portal (cedar-demo.html stays as it was). Redesigned from Daniel's reference (green header, source pills,
  a pile of suggestion chips) in the SimpleCare design system, with every suggestion built out as a working flow:
  pre-visit summary, cardiovascular risk, medication reconciliation with PharmaNet, drug interactions, unreviewed abnormal results,
  what's overdue, preventive care, the A1c graph, adding A1c to a requisition, the visit note, sick-day guidance, follow-up
  recalls, explaining results to the patient and the billing code. Each answer shows what Cedar read (Sources panel), and each
  action waits for the physician. A question about anyone else is refused. Nothing is saved or sent.
  Words: "Cedar, Simple's clinical assistant", never a chatbot. Jordan Reyes is fictional.
-->
<style>
  :root{
    --ink:var(--color-text-default-heading); --body:var(--color-text-default-body); --soft:var(--color-text-default-caption);
    --paper:var(--color-grey-200); --panel:var(--color-grey-0); --wash:var(--color-grey-50); --line:var(--color-grey-300);
    --brand:var(--color-navy-900); --brand-wash:var(--color-navy-100);
    --ai-soft:color-mix(in srgb, var(--color-brand-ai-start) 55%, var(--panel));
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--body);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
  h1,h2,h3,h4,p{margin:0;}
  button{font:inherit;}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .ic20{display:inline-flex;flex:none;width:20px;height:20px;color:var(--soft);}
  .ic20 svg{width:20px;height:20px;}
  .mark{display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:var(--radius-xs);background:var(--gradient-ai);color:var(--color-navy-900);}
  .mark svg{width:18px;height:18px;}
  .sv-tag,.sv-tag .truncate{font-size:14px;}
  .sv-table :is(.text-body-3,.text-caption){font-size:14px !important;}

  /* ---- top bar ---- */
  .top{flex:none;display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line);}
  .top .lg svg{height:30px;width:auto;}
  .top .nm{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid var(--line);font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .top .nm small{font-size:15px;font-weight:400;color:var(--soft);}
  .top .sp{flex:1;}

  /* ---- shell: patient | conversation | sources ---- */
  .shell{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 360px;}
  body.no-src .shell{grid-template-columns:300px minmax(0,1fr) 0;}
  .side,.src{min-height:0;overflow-y:auto;background:var(--panel);}
  .side{border-right:1px solid var(--line);padding:20px;}
  .src{border-left:1px solid var(--line);}
  body.no-src .src{display:none;}

  /* patient side */
  .pt{display:flex;gap:12px;align-items:center;}
  .pt .pn b{display:block;font-size:17px;line-height:24px;color:var(--ink);}
  .pt .pn span{display:block;font-size:14px;color:var(--soft);}
  .side h3{margin:22px 0 8px;font-size:14px;font-weight:700;color:var(--soft);}
  .facts{display:grid;gap:6px;margin-top:14px;font-size:14px;line-height:20px;}
  .facts div{display:flex;gap:8px;}
  .facts .ic20{width:18px;height:18px;}
  .facts .ic20 svg{width:18px;height:18px;}
  .conn{display:grid;}
  .conn li{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .conn li:first-child{border-top:0;}
  .conn .ok{display:inline-flex;width:20px;height:20px;color:var(--color-green-700);}
  .conn .ok svg{width:20px;height:20px;}
  .conn .m{flex:1;min-width:0;}
  .conn .m b{display:block;font-weight:500;font-size:15px;line-height:20px;color:var(--ink);}
  .conn .m span{display:block;font-size:14px;line-height:20px;color:var(--soft);}
  .scope{display:flex;gap:10px;margin-top:18px;padding:12px;border-radius:var(--radius-xs);background:var(--wash);font-size:14px;line-height:20px;}
  .hist{display:grid;gap:2px;padding:0;margin:0;}
  .hist li{list-style:none;}
  .hist button{display:block;width:100%;padding:8px 10px;border:0;border-radius:var(--radius-xs);background:none;text-align:left;font-size:14px;line-height:20px;color:var(--body);cursor:pointer;}
  .hist button:hover{background:var(--wash);color:var(--ink);}

  /* ---- conversation ---- */
  .conv{min-width:0;min-height:0;display:flex;flex-direction:column;}
  .thread-wrap{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;}
  .thread{max-width:860px;margin:0 auto;padding:28px 28px 12px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr);}
  .composer{flex:none;border-top:1px solid var(--line);background:color-mix(in srgb, var(--paper) 70%, var(--panel));}
  .composer .in{max-width:860px;margin:0 auto;padding:12px 28px 10px;}
  .composer .foot{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:14px;line-height:20px;color:var(--soft);text-align:center;}
  .composer .foot .ic20{width:16px;height:16px;}
  .composer .foot .ic20 svg{width:16px;height:16px;}
  .follow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}

  /* empty state */
  .hello{padding:28px 0 4px;}
  .hello .big-mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:var(--radius-md);background:var(--gradient-ai);color:var(--color-navy-900);}
  .hello .big-mark svg{width:30px;height:30px;}
  .hello h1{margin-top:18px;font-size:30px;line-height:38px;font-weight:700;color:var(--ink);}
  .hello p{margin-top:6px;max-width:64ch;font-size:16px;line-height:24px;}
  .groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px;}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xs);padding:14px 16px 10px;}
  .grp h2{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:15px;font-weight:700;color:var(--ink);}
  .grp h2 .ic20{color:var(--brand);}
  .sugg{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;margin:0 -6px;border:0;border-radius:var(--radius-xs);background:none;text-align:left;font-size:15px;line-height:22px;color:var(--body);cursor:pointer;}
  .sugg:hover{background:var(--wash);color:var(--ink);}
  .sugg:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}
  .sugg .ic20{width:16px;height:16px;margin-left:auto;}
  .sugg .ic20 svg{width:16px;height:16px;}

  /* turns */
  .q{justify-self:end;max-width:78%;}
  .q p.qt{padding:10px 14px;border-radius:var(--radius-sm);background:var(--brand);color:var(--color-grey-0);font-size:15px;line-height:22px;}
  .q .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:4px;font-size:14px;color:var(--soft);}
  .q .meta .ic20{width:14px;height:14px;}
  .q .meta .ic20 svg{width:14px;height:14px;}
  .a{display:flex;gap:12px;align-items:flex-start;}
  .a .bd{flex:1;min-width:0;}
  .a .who{display:flex;align-items:center;gap:8px;min-height:32px;font-size:14px;color:var(--soft);}
  .a .who b{color:var(--ink);font-size:15px;}
  .a .who .read{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:0;border-radius:var(--radius-xs);background:none;color:var(--soft);font-size:14px;cursor:pointer;}
  .a .who .read:hover{background:var(--wash);color:var(--ink);}
  .a.sel .who .read{background:var(--brand-wash);color:var(--brand);}
  .lead{font-size:16px;line-height:25px;color:var(--ink);margin:4px 0 12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xs);}
  .card + .card{margin-top:12px;}
  .card-hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .card-hd h3{font-size:15px;font-weight:700;color:var(--ink);}
  .card-hd .sp{flex:1;}
  .card-bd{padding:12px 16px 14px;}
  .rows{display:grid;}
  .row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);}
  .row:first-child{border-top:0;}
  .row .m{flex:1;min-width:0;}
  .row .l{display:block;font-size:15px;line-height:22px;color:var(--ink);}
  .row .s{display:block;font-size:14px;line-height:20px;color:var(--soft);}
  .row .r{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;flex:none;max-width:55%;}
  .row .sv-tag{flex:none;}
  .sec-t{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-size:14px;font-weight:700;color:var(--soft);}
  .sec-t:first-child{margin-top:0;}
  .cite{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin-left:4px;border:0;border-radius:var(--radius-2xs);background:var(--brand-wash);color:var(--brand);font-size:14px;font-weight:700;line-height:1;vertical-align:1px;cursor:pointer;}
  .cite:hover{background:var(--brand);color:var(--color-grey-0);}
  .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;}
  .done{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:var(--radius-xs);background:var(--color-green-25);font-size:14px;line-height:20px;color:var(--ink);}
  .done .ic20{color:var(--color-green-700);}
  .fine{margin-top:10px;font-size:14px;line-height:20px;color:var(--soft);}
  .a-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:14px;color:var(--soft);}
  .a-foot .sp{flex:1;}
  .fb{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:0;border-radius:var(--radius-xs);background:none;color:var(--soft);font-size:14px;cursor:pointer;}
  .fb:hover{background:var(--wash);color:var(--ink);}
  .fb[aria-pressed="true"]{background:var(--brand-wash);color:var(--brand);}
  .fb .ic20{width:16px;height:16px;color:inherit;}
  .fb .ic20 svg{width:16px;height:16px;}
  .why-wrong{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}

  /* thinking */
  .think{display:grid;gap:6px;padding:10px 0 4px;}
  .think li{list-style:none;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);}
  .think .dot{width:16px;height:16px;border-radius:var(--radius-round);border:2px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;}
  .think .ok{display:inline-flex;width:16px;height:16px;color:var(--color-green-700);}
  .think .ok svg{width:16px;height:16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .fade{animation:fadeUp .35s cubic-bezier(.2,.7,.2,1) both;}

  /* flow pieces */
  .bigval{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;font-size:28px;line-height:36px;font-weight:700;color:var(--ink);}
  .risk{padding:16px;border-radius:var(--radius-xs);background:linear-gradient(180deg, var(--ai-soft), var(--panel) 95%);border:1px solid var(--line);}
  .tbl-wrap{overflow-x:auto;max-width:100%;}
  .recon .chg{background:var(--color-yellow-50);border-radius:var(--radius-2xs);padding:0 4px;}
  .pickrow{display:flex;flex-wrap:wrap;gap:6px;}
  .handout{padding:18px 20px;border-radius:var(--radius-xs);background:var(--wash);border:1px solid var(--line);}
  .handout h4{font-size:17px;line-height:24px;color:var(--ink);margin-bottom:8px;}
  .handout p,.handout li{font-size:15px;line-height:23px;color:var(--ink);}
  .handout ul{margin:6px 0 10px;padding-left:20px;}
  .msg{padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-xs);background:var(--panel);font-size:15px;line-height:23px;color:var(--ink);outline:none;}
  .msg[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px var(--brand);}
  .notedraft .sec{padding:10px 0;border-top:1px solid var(--line);}
  .notedraft .sec:first-child{border-top:0;}
  .notedraft .h{font-size:14px;font-weight:700;color:var(--soft);margin-bottom:4px;}
  .notedraft .yours{padding:10px 12px;border:1px dashed var(--line);border-radius:var(--radius-xs);color:var(--soft);font-size:14px;}
  .chartbox{overflow-x:auto;}
  .chartbox svg text{font-size:14px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips .sv-chip{max-width:100%;white-space:normal;height:auto;text-align:left;}
  .chips .sv-chip .truncate{white-space:normal;overflow:visible;}

  /* ---- sources panel ---- */
  .src-hd{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);}
  .src-hd h2{font-size:16px;font-weight:700;color:var(--ink);}
  .src-hd .sp{flex:1;}
  .src-for{padding:12px 16px 0;font-size:14px;line-height:20px;color:var(--soft);}
  .src-for b{color:var(--ink);font-weight:500;}
  .src-list{display:grid;gap:10px;padding:12px 16px 20px;}
  .s-item{padding:12px;border:1px solid var(--line);border-radius:var(--radius-xs);background:var(--panel);transition:box-shadow .2s, border-color .2s;}
  .s-item.hl{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash);}
  .s-item .t{display:flex;align-items:center;gap:8px;}
  .s-item .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:var(--radius-2xs);background:var(--brand-wash);color:var(--brand);font-size:14px;font-weight:700;}
  .s-item b{display:block;margin-top:8px;font-weight:500;color:var(--ink);}
  .s-item .d{font-size:14px;color:var(--soft);}
  .s-item blockquote{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--line);background:var(--wash);font-size:14px;line-height:20px;color:var(--body);}
  .src-empty{padding:24px 16px;}
  .src-not{margin:0 16px 20px;font-size:14px;line-height:20px;color:var(--soft);}

  /* Ani, 21 Nov: no borders on cards (white fill on the grey page is enough) and no sharp corners anywhere */
  .grp,.card,.risk,.handout,.msg,.s-item{border:0 !important;}
  .s-item{background:var(--wash);}
  .s-item.hl{box-shadow:0 0 0 2px var(--brand);}
  .handout{background:var(--panel);}
  .sv-scroll.sv-scroll-area,.tbl-wrap,.sv-table{border-radius:var(--radius-xs);}
  .tbl-wrap .sv-scroll.sv-scroll-area{border:0 !important;}   /* the table's own frame is a card outline too */
  @media (max-width:1280px){
    .shell{grid-template-columns:260px minmax(0,1fr) 320px;}
    body.no-src .shell{grid-template-columns:260px minmax(0,1fr) 0;}
  }
  @media (max-width:1080px){
    .shell,body.no-src .shell{grid-template-columns:minmax(0,1fr);}
    .side{display:none;}
    body.side-open .side{display:block;position:fixed;inset:64px auto 0 0;width:min(320px,90vw);z-index:30;box-shadow:var(--shadow-elevation-3);}
    .src{position:fixed;inset:64px 0 0 auto;width:min(380px,92vw);z-index:30;box-shadow:var(--shadow-elevation-3);}
    .groups{grid-template-columns:minmax(0,1fr);}
  }
  @media (min-width:1081px){ [data-act="side"]{display:none !important;} }
  @media (max-width:640px){
    .top{padding:8px 12px;gap:8px;}
    .top .nm small,.top .demo,.top .lg{display:none;}
    .top .nm{border-left:0;padding-left:0;}
    .thread{padding:18px 14px 8px;}
    .composer .in{padding:10px 14px 8px;}
    .q{max-width:92%;}
    .row{flex-wrap:wrap;}
    .row .r{max-width:100%;justify-content:flex-start;}
    .a{gap:8px;}
  }
  @media (prefers-reduced-motion: reduce){ .fade{animation:none;} .think .dot{animation:none;} .thread-wrap{scroll-behavior:auto;} }
</style>

<body class="no-src">
<header class="top">
  <span id="t-side"></span>
  <span class="lg" id="t-logo" aria-label="Simple Care"></span>
  <span class="nm"><span class="mark" id="t-mark" aria-hidden="true"></span>Cedar <small>Simple's clinical assistant</small></span>
  <span class="sp"></span>
  <span class="demo" id="t-demo"></span>
  <span id="t-new"></span>
</header>
<div class="shell">
  <aside class="side" id="side" aria-label="Patient and sources"></aside>

    <div class="composer"><div class="in" id="composer"></div></div>
  </main>
  <aside class="src" id="src" aria-label="Sources"></aside>
</div>

    (s.sent ? done('Sent to ' + PT.first + '\'s patient portal by you, ' + s.sent + '. Test mode: nothing is sent.') : '<div class="acts">' + btn('primary', 'Review and send to Jordan', 'sickSend', 'Send this handout to Jordan\'s patient portal after you review it', 'send') + btn('secondary-main', 'Print', 'noop', 'Print the handout; not part of this demo', 'file') + '</div>') +
    '<p class="fine">Grade 6 reading level. Based on Diabetes Canada\'s sick-day medicine list.</p>';
};
A.recalls = function(){
  var s = fs('recalls'); if(!s.r) s.r = {k:true, a1c:true, bp:true, eye:true};
  var L = [['k', 'Kidney function and potassium', 'In 2 weeks · 4 December 2026', 'egfr'], ['bp', 'Blood pressure check', 'In 4 weeks · 18 December 2026', 'lastnote'], ['a1c', 'Hemoglobin A1c', 'In 3 months · 18 February 2027', 'a1c'], ['eye', 'Eye exam referral follow-up', 'In 3 months · 20 February 2027', 'eye']];
  var n = L.filter(function(x){ return s.r[x[0]]; }).length;
  return '<p class="lead">' + n + ' recall' + (n === 1 ? '' : 's') + ' proposed. ' + PT.first + ' gets a reminder in his portal, and they show on your recall list.</p><div class="card"><div class="card-bd"><div class="rows">' +
    L.map(function(x){ return row(esc(x[1]) + c('recalls', x[3]), esc(x[2]), s.made ? (s.r[x[0]] ? tag('success', 'Recall set', '', 'check') : tag('neutral', 'Skipped')) : SC.html('Chip', {'data-act':'recT', 'data-v':x[0], selected:!!s.r[x[0]], title:(s.r[x[0]] ? 'Skip' : 'Keep') + ' this recall'}, s.r[x[0]] ? 'On' : 'Off')); }).join('') +
    '</div></div></div>' + (s.made ? done(n + ' recall' + (n === 1 ? '' : 's') + ' created by you, ' + s.made + '.') : '<div class="acts">' + btn('primary', 'Create ' + n + ' recall' + (n === 1 ? '' : 's'), 'recMake', 'Create these recalls and reminders', 'clock-time-add', n ? {} : {disabled:true}) + '</div>');
};
A.explain = function(){
  var s = fs('explain');
  var txt = s.txt || ('Hi Jordan, here are your test results from 18 November.\n\nYour average blood sugar (A1c) is 8.4%. It has gone up a little at each test this past year, from 7.1%. We aim for 7.0% or lower.\n\nYour kidney test is lower than in July, and there is a small amount of protein in your urine. Your potassium is slightly high. We will repeat these tests in 1 to 2 weeks to check them.\n\nYour cholesterol is a bit above where we want it.\n\nWe will talk about all of this at your visit today. — Dr. Pannozzo');
  return '<p class="lead">A message for ' + PT.first + ' in plain words' + c('explain', 'a1c') + c('explain', 'egfr') + c('explain', 'acr') + c('explain', 'k') + c('explain', 'lipids') + '. Edit it before it goes.</p>' +
    '<div class="msg" id="msg" contenteditable="' + (s.sent ? 'false' : 'true') + '" role="textbox" aria-multiline="true" aria-label="Message to Jordan" style="white-space:pre-wrap">' + esc(txt) + '</div>' +
    (s.sent ? done('Sent to ' + PT.first + '\'s patient portal by you, ' + s.sent + '. Test mode: nothing is sent.') : '<div class="acts">' + btn('primary', 'Send after the visit', 'expSend', 'Send this message to Jordan\'s portal once you have signed today\'s note', 'send') + tag('neutral', 'Grade 6 reading level') + '</div>') +
    '<p class="fine">Cedar explains the results; it doesn\'t add new advice.</p>';
};
A.billing = function(){
  var s = fs('billing'), C = [['250', 'Diabetes mellitus', 'Today\'s booking is a diabetes follow-up, and the results reviewed are for diabetes.'], ['401', 'Essential hypertension', 'If the visit is mainly about the losartan change.'], ['272', 'Disorders of lipoid metabolism', 'If the visit is mainly about cholesterol.']];
  var pick = s.pick ? C.filter(function(x){ return x[0] === s.pick; })[0] : null;
  return '<p class="lead">One code, from the booking and problem list' + c('billing', 'booking') + c('billing', 'problems') + '. Confirm it after the visit; the note can change it.</p>' +
    '<div class="risk"><p style="font-size:14px;color:var(--soft)">Suggested diagnostic code' + c('billing', 'icd') + '</p><p class="bigval">' + (pick || C[0])[0] + ' <span style="font-weight:400">' + (pick || C[0])[1] + '</span></p><p style="margin-top:4px;color:var(--ink)">' + (pick || C[0])[2] + '</p>' +
    (pick ? done('On the claim, chosen by you, ' + s.at + '. Test mode: no claim is sent to the Medical Services Plan.') :
      '<div class="acts">' + btn('primary', 'Use 250', 'billPick', 'Put 250 Diabetes mellitus on the claim', 'check', {'data-v':'250'}) + '</div>') + '</div>' +
    (pick ? '' : '<p class="sec-t" style="margin-top:14px">Other codes that fit</p><div class="card"><div class="card-bd"><div class="rows">' + C.slice(1).map(function(x){ return row('<b style="font-variant-numeric:tabular-nums">' + x[0] + '</b> ' + esc(x[1]), esc(x[2]), sbtn('secondary-main', 'Use ' + x[0], 'billPick', 'Put ' + x[0] + ' ' + x[1] + ' on the claim instead', null, {'data-v':x[0]})); }).join('') + '</div></div></div>');
};
A.refuse = function(t){ return '<p class="lead">This conversation is about ' + PT.name + ' only, so Cedar won\'t look at anyone else\'s record here. Open the other patient\'s chart to ask about them.</p>'; };
A.free = function(){ return '<p class="lead">In this demo, Cedar answers the questions below. In Simple it answers any question about the open record the same way: from the record, with its sources, leaving every decision to you.</p>' +
  '<div class="chips">' + Object.keys(F).slice(0, 6).map(function(k){ return SC.html('Chip', {'data-act':'ask', 'data-v':k, title:'Ask: ' + F[k].q}, F[k].q); }).join('') + '</div>'; };

/* ============================================================================
   Rendering
   ========================================================================= */
function paintSide(){
  var conn = Object.keys(SYS).map(function(k){ return '<li title="Connected · ' + esc(SYS[k][1]) + '"><span class="ok">' + ic('check-circle', 20) + '</span><span class="m"><b>' + esc(SYS[k][0]) + '</b><span>' + esc(SYS[k][1]) + '</span></span></li>'; }).join('');
  var asked = ST.turns.filter(function(t){ return t.k !== 'refuse' && t.k !== 'free'; });
  document.getElementById('side').innerHTML =
    '<div class="pt">' + SC.html('AvatarCircle', {name:PT.name, size:'large', decorative:true}) + '<span class="pn"><b>' + PT.name + '</b><span>' + PT.age + ' · ' + PT.sex + '</span></span></div>' +
    '<div style="margin-top:10px">' + tag('purple', 'Fictional patient', 'Made up for this demo') + '</div>' +
    '<div class="facts"><div>' + I('calendar', 18) + '<span>Video visit today, 2:30 p.m.</span></div><div>' + I('medical', 18) + '<span>Type 2 diabetes · high blood pressure · high cholesterol</span></div><div>' + I('medication', 18) + '<span>6 medications across the chart and PharmaNet</span></div></div>' +
    '<h3>Cedar can read</h3><ul class="conn" style="padding:0;margin:0">' + conn + '</ul>' +
    '<div class="scope">' + I('shield-check') + '<span>Cedar answers from ' + PT.first + '\'s record only. It drafts and suggests; you decide. Every question shows in ' + PT.first + '\'s access log.</span></div>' +
    (asked.length ? '<h3>In this conversation</h3><ul class="hist">' + asked.map(function(t){ return '<li><button type="button" data-act="jump" data-v="' + t.id + '" title="Go back to this answer">' + esc(t.q) + '</button></li>'; }).join('') + '</ul>' : '');
}
function hello(){
  return '<div class="hello fade"><span class="big-mark">' + ic('ai', 30) + '</span><h1>Good afternoon, Dr. Pannozzo</h1>' +
    '<p>' + PT.name + '\'s record is open. Ask anything about it: the Simple chart, PharmaNet, lab results, the Clinical Data Exchange and faxed reports. Cedar shows where every answer comes from and never decides for you.</p></div>' +
    '<div class="groups fade" style="animation-delay:.08s">' + GROUPS.map(function(g){
      return '<section class="grp"><h2>' + I(g[1]) + esc(g[0]) + '</h2>' + g[2].map(function(k){ return '<button type="button" class="sugg" data-act="ask" data-v="' + k + '" title="Ask Cedar: ' + esc(F[k].q) + '">' + esc(F[k].q) + I('arrow-direction-right', 16) + '</button>'; }).join('') + '</section>'; }).join('') + '</div>';
}
function turnHtml(t){
  var fd = t.anim ? ' fade' : '';
  var q = '<div class="q' + fd + '"><p class="qt">' + esc(t.q) + '</p><p class="meta">' + I('eye-on', 14) + 'Logged in ' + PT.first + '\'s access log · ' + t.at + '</p></div>';
  if(t.pending){
    var steps = ['Checking you are in ' + PT.first + '\'s circle of care'].concat((F[t.k] ? F[t.k].read : []).length ? ['Reading ' + F[t.k].read.join(', ')] : []).concat(['Writing the answer, with sources']);
    return q + '<div class="a' + fd + '" id="' + t.id + '">' + mark() + '<div class="bd"><p class="who"><b>Cedar</b></p><ul class="think" style="margin:0;padding:0">' + steps.map(function(s, i){
      return '<li>' + (i < t.step ? '<span class="ok">' + ic('check-circle', 16) + '</span>' : i === t.step ? '<span class="dot"></span>' : '<span class="dot" style="animation:none;border-top-color:var(--line)"></span>') + esc(s) + '</li>'; }).join('') + '</ul></div></div>';
  }
  var f = F[t.k], n = f ? f.src.length : 0, fb = t.fb;
  var foot = '<div class="a-foot">' + (n ? '<span>' + n + ' source' + (n > 1 ? 's' : '') + '</span>' : '') + '<span class="sp"></span>' +
    '<button type="button" class="fb" data-act="fb" data-v="' + t.id + ':up" aria-pressed="' + (fb === 'up') + '" title="Tell Cedar this answer was helpful">' + I('check', 16) + 'Helpful</button>' +
    '<button type="button" class="fb" data-act="fb" data-v="' + t.id + ':down" aria-pressed="' + (fb && fb !== 'up') + '" title="Tell Cedar what was wrong; it helps train your own model">' + I('warning', 16) + 'Not right</button></div>' +
    (fb === 'down' ? '<div class="why-wrong fade">' + ['Wrong facts', 'Missed something', 'Not useful'].map(function(r){ return SC.html('Chip', {'data-act':'fbWhy', 'data-v':t.id + ':' + r, title:'Report: ' + r}, r); }).join('') + '</div>' : '') +
    (fb && fb !== 'up' && fb !== 'down' ? '<p class="fine fade">Thanks. "' + esc(fb) + '" is saved with this answer to improve your own Cedar model.</p>' : '') +
    (fb === 'up' ? '<p class="fine fade">Thanks. Saved as a good example for your own Cedar model.</p>' : '');
  return q + '<div class="a' + (ST.sel === t.id ? ' sel' : '') + '" id="' + t.id + '">' + mark() + '<div class="bd"><p class="who"><b>Cedar</b>' +
    (n ? '<button type="button" class="read" data-act="srcOpen" data-v="' + t.id + '" title="Show the ' + n + ' entries Cedar read for this answer">' + ic('eye-on', 16) + 'Read ' + n + ' entr' + (n > 1 ? 'ies' : 'y') + '</button>' : '') + '</p>' +
    '<div class="' + fd.trim() + '">' + (t.k === 'refuse' ? A.refuse() : t.k === 'free' ? A.free() : A[t.k]()) + '</div>' + (t.k === 'refuse' || t.k === 'free' ? '' : foot) + '</div></div>';
}
function paintThread(scrollId){
  var th = document.getElementById('thread');
  th.innerHTML = ST.turns.length ? ST.turns.map(turnHtml).join('') : hello();
  ST.turns.forEach(function(t){ t.anim = false; });
  if(scrollId){ var el = document.getElementById(scrollId); if(el){ var tw = document.getElementById('tw'); tw.scrollTop = Math.max(0, el.offsetTop - 120); } }
}
function paintComposer(){
  var last = ST.turns[ST.turns.length - 1], nx = last && F[last.k] && !last.pending ? F[last.k].next.filter(function(k){ return !ST.turns.some(function(t){ return t.k === k; }); }) : [];
  if(!nx.length && ST.turns.length) nx = Object.keys(F).filter(function(k){ return !ST.turns.some(function(t){ return t.k === k; }); }).slice(0, 3);
  document.getElementById('composer').innerHTML = (nx.length ? '<div class="follow">' + nx.map(function(k){ return SC.html('Chip', {'data-act':'ask', 'data-v':k, title:'Ask Cedar: ' + F[k].q}, F[k].q); }).join('') + '</div>' : '') +
    SC.html('MessageInput', {placeholder:'Ask Cedar about ' + PT.first + '…', label:'Ask Cedar', id:'ask'}) +
    '<p class="foot">' + I('eye-on', 16) + 'Each question is one call to Cedar\'s free open interface, logged where ' + PT.first + ' can see it.</p>';
  wireComposer();
}
function paintSrc(hl){
  var el = document.getElementById('src'), t = ST.turns.filter(function(x){ return x.id === ST.sel; })[0];
  if(!t || !F[t.k]){ el.innerHTML = ''; return; }
  var f = F[t.k];
  el.innerHTML = '<div class="src-hd">' + I('eye-on') + '<h2>Sources</h2><span class="sp"></span>' + btn('tertiary-main', '', 'srcClose', 'Close the sources panel', 'x', {'aria-label':'Close sources'}) + '</div>' +
    '<p class="src-for">What Cedar read for <b>' + esc(t.q) + '</b></p><div class="src-list">' +
    f.src.map(function(k, i){ var s = SRC[k]; return '<div class="s-item' + (hl === k ? ' hl' : '') + '" id="s-' + k + '"><div class="t"><span class="n">' + (i + 1) + '</span>' + tag('neutral', SYS_SHORT[s[0]]) + '</div><b>' + esc(s[1]) + '</b><span class="d">' + esc(s[2]) + '</span><blockquote>' + esc(s[3]) + '</blockquote></div>'; }).join('') +
    '</div><p class="src-not">Cedar read only these ' + f.src.length + ' entries, not the rest of ' + PT.first + '\'s record.</p>';
  if(hl){ var h = document.getElementById('s-' + hl); if(h) h.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function paintAll(scrollId){ paintSide(); paintThread(scrollId); paintComposer(); paintSrc(); }

/* ============================================================================
   Asking
   ========================================================================= */
var TID = 0;
function ask(k, text){
  if(ST.busy) return;
  var t = {id:'t' + (++TID), k:k, q:text || (F[k] ? F[k].q : text), at:now(), pending:!!F[k], step:0, anim:true};
  ST.turns.push(t); ST.busy = true;
  if(!F[k]){ ST.busy = false; paintAll(t.id); return; }
  var steps = 2 + (F[k].read.length ? 1 : 0);
  paintAll(t.id);
  var i = 0, tick = function(){
    i++; t.step = i;
    if(i >= steps){ t.pending = false; t.anim = true; ST.busy = false; ST.sel = t.id; if(window.innerWidth > 1080) document.body.classList.remove('no-src'); paintAll(t.id); return; }   /* on narrow screens Sources opens only when asked */
    paintThread(t.id); setTimeout(tick, 520);
  };
  setTimeout(tick, 420);
}
function askText(text){
  var tl = text.toLowerCase(), k = null;
  if(/\b(other patient|someone else|my wife|his wife|her husband|another patient|mary|smith|neighbou?r)\b/.test(tl) || (/\b[A-Z][a-z]+ [A-Z][a-z]+\b/.test(text) && !/Jordan|Reyes|Pannozzo|Chen|Singh/.test(text))) k = 'refuse';
  else KEYS.some(function(p){ if(p[1].test(tl)){ k = p[0]; return true; } });
  if(k === 'refuse' || !k){ ST.turns.push({id:'t' + (++TID), k:k || 'free', q:text, at:now(), anim:true}); paintAll('t' + TID); return; }
  ask(k, text);
}
function wireComposer(){
  var box = document.getElementById('ask'); if(!box) return;
  var root = box.closest('.sv-message-input') || box.parentElement;
  var send = function(){ var v = (box.value || '').trim(); if(!v || ST.busy) return; askText(v); };
  box.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  root.querySelectorAll('button').forEach(function(b){
    var lab = b.getAttribute('aria-label') || '';
    if(/attach/i.test(lab)){ b.remove(); return; }
    if(/send/i.test(lab)){ b.title = 'Ask Cedar'; b.addEventListener('click', function(e){ e.preventDefault(); send(); }); box.addEventListener('input', function(){ b.disabled = !box.value.trim(); }); }
  });
}
function rerender(k){ var t = ST.turns.filter(function(x){ return x.k === k; }).pop(); paintThread(); paintSide(); return t; }

document.addEventListener('click', function(e){
  var a = e.target.closest('[data-act]'); if(!a || a.disabled) return;
  var act = a.getAttribute('data-act'), v = a.getAttribute('data-v') || '';
  var keep = document.getElementById('tw').scrollTop, stay = function(){ document.getElementById('tw').scrollTop = keep; };
  switch(act){
    case 'ask': ask(v); break;
    case 'new': ST = {turns:[], sel:null, flows:{}, busy:false}; document.body.classList.add('no-src'); paintAll(); break;
    case 'jump': var j = document.getElementById(v); if(j) document.getElementById('tw').scrollTop = Math.max(0, j.offsetTop - 120); document.body.classList.remove('side-open'); break;
    case 'side': document.body.classList.toggle('side-open'); break;
    case 'srcOpen': ST.sel = v; document.body.classList.remove('no-src'); paintThread(); stay(); paintSrc(); break;
    case 'srcClose': document.body.classList.add('no-src'); break;
    case 'cite': var tt = ST.turns.filter(function(x){ return x.k === a.getAttribute('data-f'); }).pop(); if(tt){ ST.sel = tt.id; document.body.classList.remove('no-src'); paintThread(); stay(); paintSrc(v); } break;
    case 'fb': var p = v.split(':'), ft = ST.turns.filter(function(x){ return x.id === p[0]; })[0]; if(ft){ ft.fb = ft.fb === p[1] ? null : p[1]; paintThread(); stay(); } break;
    case 'fbWhy': var q = v.split(':'), wt = ST.turns.filter(function(x){ return x.id === q[0]; })[0]; if(wt){ wt.fb = q[1]; paintThread(); stay(); } break;
    case 'riskAdd': fs('risk').added = now(); paintThread(); stay(); break;
    case 'reconPick': var rp = v.split(':'); fs('recon').pick[rp[0]] = rp[1]; paintThread(); stay(); break;
    case 'reconApply': fs('recon').applied = now(); paintThread(); stay(); break;
    case 'ddiAct': var dp = v.split(':'); fs('ddi').x[dp[0]] = dp[1]; paintThread(); stay(); break;
    case 'abnRev': fs('abnormal').r[v] = 1; paintThread(); stay(); break;
    case 'abnAll': ['egfr', 'acr', 'k'].forEach(function(k){ fs('abnormal').r[k] = 1; }); paintThread(); stay(); break;
    case 'odAct': var op = v.split(':'); fs('overdue').x[op[0]] = op[1]; paintThread(); stay(); break;
    case 'reqT': fs('req').t[v] = !fs('req').t[v]; paintThread(); stay(); break;
    case 'reqSign': fs('req').sent = now(); paintThread(); stay(); break;
    case 'noteOpen': fs('note').open = 1; paintThread(); stay(); break;
    case 'copy': a.querySelector('span:last-child') && (a.lastChild.textContent = 'Copied'); break;
    case 'sickSend': fs('sick').sent = now(); paintThread(); stay(); break;
    case 'recT': fs('recalls').r[v] = !fs('recalls').r[v]; paintThread(); stay(); break;
    case 'recMake': fs('recalls').made = now(); paintThread(); stay(); break;
    case 'expSend': var m = document.getElementById('msg'); if(m) fs('explain').txt = m.innerText; fs('explain').sent = now(); paintThread(); stay(); break;
    case 'billPick': fs('billing').pick = v; fs('billing').at = now(); paintThread(); stay(); break;
  }
});
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('t-logo').innerHTML = SC.html('Logo', {lockup:'horizontal', height:30});
  document.getElementById('t-mark').innerHTML = ic('ai', 18);
  document.getElementById('t-side').innerHTML = btn('tertiary-main', '', 'side', 'Show the patient and the connected sources', 'user', {'aria-label':'Patient and sources'});
  document.getElementById('t-demo').innerHTML = tag('information', 'Demo · fictional patient · nothing is saved', 'Nothing here creates a record, an order, a message or a claim', 'shield-check');
  document.getElementById('t-new').innerHTML = btn('secondary-main', 'New conversation', 'new', 'Clear this conversation and start again', 'note-add');
  paintAll();
});
</script>
