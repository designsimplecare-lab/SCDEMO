<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cedar demo</title>
<meta name="description" content="Cedar, Simple's clinical assistant: a walkthrough with a test patient, from triage intake to the patient's access log.">
<!--
  Cedar demo (Ani, 19 Nov 2026), for the Mozilla Human-Scale AI application (due 20 November 2026).
  Source: "Cedar Clinical Assistant: Design Brief" (Daniel, 19 Nov) items 2 to 7, and the application's answers 3 to 6 and 14.
  One test patient, seven steps: triage intake, note drafting, diagnostic code, Ask Cedar (physician), Ask Cedar (patient),
  access log, and how Cedar runs. Nothing here is saved or sent. Built from the SimpleCare design system (assets/design-system).
  Words: "Cedar, Simple's clinical assistant", never a chatbot.
  Presentation (Ani, 19 Nov, "make this presentation more amazing"): a cover, product screens floating on Cedar's brand gradient
  inside a portal window or a phone, numbered "What to notice" markers, Cedar's answers typing out, the note drafting itself,
  Play this step / Play the tour for recording, and a full-screen Present mode.
-->
<style>
  :root{
    --ink:var(--color-text-default-heading); --body:var(--color-text-default-body); --soft:var(--color-text-default-caption);
    --paper:var(--color-grey-200); --panel:var(--color-grey-0); --wash:var(--color-grey-50); --line:var(--color-grey-300);
    --brand:var(--color-navy-900); --brand-wash:var(--color-navy-100);
    --crit:var(--color-red-700); --crit-wash:var(--color-red-50); --crit-line:var(--color-red-200);
    --canvas:linear-gradient(135deg, color-mix(in srgb, var(--color-brand-ai-start) 85%, var(--panel)) 0%, color-mix(in srgb, var(--color-brand-ai-start) 35%, var(--panel)) 45%, color-mix(in srgb, var(--color-brand-ai-end) 70%, var(--panel)) 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--body);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4,p{margin:0;}
  button{font:inherit;}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* ---- top bar ---- */
  .cd-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 24px;background:color-mix(in srgb, var(--panel) 88%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .cd-top .cd-logo{display:inline-flex;align-items:center;}
  .cd-top .cd-logo svg{height:32px;width:auto;}
  .cd-top .cd-name{display:flex;align-items:center;gap:8px;padding-left:16px;border-left:1px solid var(--line);font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .cd-top .cd-name small{font-size:15px;font-weight:400;color:var(--soft);}
  .cd-top .cd-sp{flex:1;}
  .mark{display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:var(--radius-xs);background:var(--gradient-ai);color:var(--color-navy-900);}
  .mark svg{width:18px;height:18px;}

  /* ---- shell ---- */
  .cd-shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:28px;max-width:1480px;margin:0 auto;padding:24px;}
  body.present .cd-shell{grid-template-columns:minmax(0,1fr);max-width:1600px;}
  body.present .cd-steps{display:none;}

  /* step timeline */
  .cd-steps{position:sticky;top:88px;align-self:start;padding:8px 0;}
  .cd-steps ol{list-style:none;margin:0;padding:0;position:relative;}
  .cd-steps ol::before{content:"";position:absolute;left:25px;top:24px;bottom:24px;width:2px;background:var(--line);}
  .cd-step{position:relative;display:flex;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--radius-xs);background:none;text-align:left;cursor:pointer;color:var(--body);}
  .cd-step:hover{background:color-mix(in srgb, var(--panel) 70%, transparent);}
  .cd-step:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}
  .cd-step[aria-current="step"]{background:var(--panel);box-shadow:var(--shadow-elevation-1);}
  .cd-step .n{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:var(--radius-round);background:var(--panel);border:2px solid var(--line);font-size:14px;font-weight:700;color:var(--soft);}
  .cd-step .n svg{width:16px;height:16px;}
  .cd-step.seen .n{border-color:var(--brand);color:var(--brand);}
  .cd-step[aria-current="step"] .n{background:var(--brand);border-color:var(--brand);color:var(--color-grey-0);box-shadow:0 0 0 4px var(--brand-wash);}
  .cd-step .t{display:block;font-size:15px;font-weight:700;line-height:20px;color:var(--ink);}
  .cd-step .w{display:block;font-size:14px;line-height:20px;color:var(--soft);}
  .cd-steps .cd-safe{display:flex;gap:8px;margin:16px 12px 0;padding-top:16px;border-top:1px solid var(--line);font-size:14px;line-height:20px;color:var(--soft);}

  .cd-main{min-width:0;outline:none;}
  .cd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin:4px 0 20px;}
  .cd-head .txt{flex:1 1 520px;min-width:0;}
  .cd-eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--soft);margin-bottom:6px;}
  .cd-head h1{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  .cd-head .lead{margin-top:8px;max-width:72ch;font-size:17px;line-height:26px;color:var(--body);}
  .cd-head .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .cd-foot{display:flex;align-items:center;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);}
  .cd-foot .sp{flex:1;}
  .cd-foot .pos{font-size:14px;color:var(--soft);}

  /* ---- the canvas: product screens float on Cedar's gradient ---- */
  .canvas{position:relative;padding:40px;border-radius:var(--radius-lg);background:var(--canvas);overflow:hidden;}
  .canvas::after{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:var(--radius-round);background:radial-gradient(closest-side, color-mix(in srgb, var(--panel) 55%, transparent), transparent);pointer-events:none;}
  .canvas > *{position:relative;z-index:1;}
  .canvas-cap{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:500;color:var(--color-navy-800);}
  .canvas-cap .ic20{color:var(--color-navy-800);}

  /* app window (physician screens) */
  .win{background:var(--paper);border-radius:var(--radius-sm);box-shadow:var(--shadow-elevation-3);overflow:hidden;border:1px solid color-mix(in srgb, var(--color-grey-900) 10%, transparent);}
  .win-bar{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);}
  .win-bar .dots{display:inline-flex;gap:6px;}
  .win-bar .dots i{width:10px;height:10px;border-radius:var(--radius-round);background:var(--line);}
  .win-bar .lg svg{height:22px;width:auto;}
  .win-bar .win-t{font-size:14px;font-weight:500;color:var(--soft);padding-left:12px;border-left:1px solid var(--line);}
  .win-bar .sp{flex:1;}
  .pt-chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);}
  .pt-chip span{color:var(--soft);}
  .win-bd{padding:20px;}

  /* phone (patient screens) */
  .phone{position:relative;width:380px;max-width:100%;margin:0 auto;border:10px solid var(--color-grey-900);border-radius:var(--radius-3xl);background:var(--panel);overflow:hidden;box-shadow:var(--shadow-elevation-3);}
  .phone::before{content:"";position:absolute;top:6px;left:50%;width:84px;height:6px;margin-left:-42px;border-radius:var(--radius-round);background:var(--color-grey-900);z-index:2;}
  .phone-bar{display:flex;align-items:center;gap:8px;min-height:56px;padding:16px 16px 8px;border-bottom:1px solid var(--line);}
  .phone-bar .lg svg{height:22px;width:auto;}
  .phone-bar .who{margin-left:auto;font-size:14px;color:var(--soft);}
  .phone-bd{min-height:560px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px;}
  .phone-bd > *{min-width:0;}
  .phone-bd .q{font-size:20px;line-height:28px;font-weight:700;color:var(--ink);}
  .phone-bd .hint{font-size:14px;line-height:20px;color:var(--soft);}
  .split{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start;}
  .split .side{display:grid;gap:16px;}

  /* ---- what to notice ---- */
  .mk{display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:var(--radius-round);background:var(--brand);color:var(--color-grey-0);font-size:14px;font-weight:700;line-height:1;box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);vertical-align:middle;}
  .mk.pulse{animation:mkpulse 1.6s ease-out 2;}
  @keyframes mkpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--brand) 45%, transparent);}100%{box-shadow:0 0 0 12px transparent;}}
  .notice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px;}
  .notice li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xs);}
  .notice li b{display:block;font-size:15px;line-height:22px;color:var(--ink);}
  .notice li span.s{display:block;margin-top:2px;font-size:14px;line-height:20px;color:var(--soft);}
  .notice-h{display:flex;align-items:center;gap:8px;margin:24px 0 0;font-size:14px;font-weight:700;color:var(--soft);}

  /* ---- shared pieces ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xs);}
  .card-hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:56px;padding:12px 20px;border-bottom:1px solid var(--line);}
  .card-hd h2,.card-hd h3{font-size:16px;line-height:22px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .card-hd .sub{font-size:14px;color:var(--soft);}
  .card-hd > span > .sub{display:block;}
  .card-hd .sp{flex:1;}
  .card-bd{padding:16px 20px 20px;}
  .ic20{display:inline-flex;flex:none;width:20px;height:20px;color:var(--soft);}
  .ic20 svg{width:20px;height:20px;}
  .ai-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-xs);background:var(--gradient-ai);color:var(--color-navy-900);font-size:14px;font-weight:500;white-space:nowrap;}
  .ai-chip svg{width:16px;height:16px;}
  .note-quiet{font-size:14px;line-height:20px;color:var(--soft);}
  .two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;}
  .stack{display:grid;gap:16px;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opts .sv-chip{justify-content:flex-start;width:100%;}
  .prog{display:flex;gap:4px;}
  .prog i{flex:1;height:4px;border-radius:var(--radius-round);background:var(--line);transition:background .3s;}
  .prog i.on{background:var(--brand);}
  .answered{display:flex;flex-wrap:wrap;gap:6px;}
  .ta{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-xs);font:inherit;font-size:15px;line-height:22px;color:var(--ink);resize:vertical;}
  .ta:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent;}
  .rows{display:grid;}
  .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);}
  .row:first-child{border-top:0;}
  .row .m{flex:1;min-width:0;}
  .row .l{display:block;font-size:15px;line-height:22px;color:var(--ink);}
  .row .s{display:block;font-size:14px;line-height:20px;color:var(--soft);}
  .row .sv-tag{flex:none;}

  /* emergency */
  .er{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--radius-sm);background:var(--crit-wash);border:1px solid var(--crit-line);}
  .er .er-ic{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;border-radius:var(--radius-round);background:var(--crit);color:var(--color-grey-0);animation:erpulse 1.4s ease-out 3;}
  @keyframes erpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--crit) 45%, transparent);}100%{box-shadow:0 0 0 16px transparent;}}
  .er .er-ic svg{width:22px;height:22px;}
  .er h2{font-size:26px;line-height:32px;font-weight:700;color:var(--crit);}
  .er p{font-size:16px;line-height:24px;color:var(--ink);}
  .er-call{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:var(--radius-control);background:var(--crit);color:var(--color-grey-0);font-size:17px;font-weight:700;cursor:pointer;}
  .er-call svg{width:20px;height:20px;}
  .alert-doc{background:var(--panel);border:1px solid var(--crit-line);border-left:4px solid var(--crit);border-radius:var(--radius-xs);box-shadow:var(--shadow-elevation-2);}
  .float{box-shadow:var(--shadow-elevation-2);}

  /* note */
  .note-sec{padding:14px 0;border-top:1px solid var(--line);}
  .note-sec:first-child{border-top:0;padding-top:4px;}
  .note-sec .h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--soft);}
  .note-sec .ed{padding:8px 10px;margin:0 -10px;border-radius:var(--radius-xs);font-size:15px;line-height:23px;color:var(--ink);outline:none;}
  .note-sec .ed:hover{background:var(--wash);}
  .note-sec .ed:focus{background:var(--wash);box-shadow:inset 0 0 0 2px var(--brand);}
  .note-sec .ed[contenteditable="false"]{background:none;box-shadow:none;}
  .note-sec.edited .ed{background:var(--color-yellow-25);}
  .note-sec.edited .h::after{content:"Edited by you";margin-left:auto;font-weight:400;color:var(--color-yellow-800);}
  .drafting{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:12px;border-radius:var(--radius-xs);background:var(--gradient-ai);font-size:14px;color:var(--color-navy-900);}
  .drafting .dot{width:8px;height:8px;border-radius:var(--radius-round);background:var(--color-navy-900);animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.25;}}
  .signed-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line);font-size:14px;color:var(--soft);}
  .reveal{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both;}

  /* code */
  .code{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);}
  .sugg{padding:18px;border-radius:var(--radius-xs);background:linear-gradient(180deg, color-mix(in srgb, var(--color-brand-ai-start) 55%, var(--panel)), var(--panel) 90%);border:1px solid var(--line);}
  .sugg .big{display:flex;align-items:baseline;gap:12px;margin:10px 0 4px;font-size:26px;line-height:34px;color:var(--ink);}
  .sugg .why{font-size:15px;line-height:22px;color:var(--body);}
  .alt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;}
  .alt:hover{background:var(--wash);}
  .alt .k{width:64px;flex:none;}
  .alt .m{flex:1;min-width:0;}
  .alt .m b{display:block;font-weight:500;color:var(--ink);}
  .alt .m span{display:block;font-size:14px;line-height:20px;color:var(--soft);}
  .claimline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;}
  .claimline dt{font-size:14px;color:var(--soft);}
  .claimline dd{margin:2px 0 0;font-size:15px;color:var(--ink);}

  /* ask cedar */
  .ask-scope{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-xs);background:var(--wash);font-size:14px;line-height:20px;color:var(--body);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips .sv-chip,.opts .sv-chip{max-width:100%;flex-shrink:1;white-space:normal;text-align:left;height:auto;}
  .chips .sv-chip .truncate,.opts .sv-chip .truncate{white-space:normal;overflow:visible;}
  .thread{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);}
  .qa-q{justify-self:end;max-width:85%;padding:10px 14px;border-radius:var(--radius-sm);background:var(--brand);color:var(--color-grey-0);font-size:15px;line-height:22px;}
  .qa-a{display:flex;gap:10px;align-items:flex-start;}
  .qa-a .body{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);}
  .qa-a .body p{font-size:15px;line-height:23px;color:var(--ink);}
  .qa-a .src{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--soft);}
  .qa-a .src .sv-tag{height:auto;min-height:28px;max-width:100%;white-space:normal;}
  .qa-a .src .sv-tag .truncate{white-space:normal;overflow:visible;text-overflow:clip;}
  .qa-a.refuse .body{background:var(--wash);}
  .qa-a .reading{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);}
  .qa-a .reading .dot{width:8px;height:8px;border-radius:var(--radius-round);background:var(--color-navy-700);animation:blink 1s infinite;}
  .typing .src{opacity:0;}
  .src{transition:opacity .3s;}
  .phone .qa-q{max-width:90%;}

  /* access log */
  .who-cell{display:flex;align-items:center;gap:10px;}
  .who-cell .wt b{display:block;font-weight:500;color:var(--ink);}
  .who-cell .wt span{display:block;font-size:14px;color:var(--soft);}
  .tbl-wrap{overflow-x:auto;max-width:100%;}

  /* how it runs */
  .flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0;padding:0;counter-reset:f;}
  .flow li{list-style:none;position:relative;padding:16px;border-radius:var(--radius-xs);background:var(--wash);}
  .flow li::before{counter-increment:f;content:counter(f);display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-bottom:10px;border-radius:var(--radius-round);background:var(--brand);color:var(--color-grey-0);font-size:14px;font-weight:700;}
  .flow li b{display:block;font-size:15px;color:var(--ink);}
  .flow li span{display:block;font-size:14px;line-height:20px;color:var(--soft);}

  /* ---- cover ---- */
  .hero{position:relative;padding:56px 56px 48px;border-radius:var(--radius-lg);background:var(--canvas);overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-140px;top:-140px;width:520px;height:520px;border-radius:var(--radius-round);background:radial-gradient(closest-side, color-mix(in srgb, var(--panel) 60%, transparent), transparent);pointer-events:none;}
  .hero > *{position:relative;z-index:1;}
  .hero .big-mark{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:var(--radius-md);background:var(--panel);color:var(--color-navy-900);box-shadow:var(--shadow-elevation-2);}
  .hero .big-mark svg{width:40px;height:40px;}
  .hero h1{margin-top:24px;font-size:56px;line-height:60px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
  .hero .tagline{margin-top:6px;font-size:24px;line-height:32px;color:var(--color-navy-800);}
  .hero .lead{margin-top:18px;max-width:62ch;font-size:18px;line-height:28px;color:var(--ink);}
  .hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:40px;}
  .stat{padding:16px 18px;border-radius:var(--radius-sm);background:color-mix(in srgb, var(--panel) 80%, transparent);backdrop-filter:blur(8px);}
  .stat b{display:block;font-size:28px;line-height:36px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .stat span{display:block;font-size:14px;line-height:20px;color:var(--body);}
  .princ{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px;}
  .princ .card-bd{padding:22px;}
  .princ .tile{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-xs);background:var(--brand-wash);color:var(--brand);}
  .princ .tile svg{width:22px;height:22px;}
  .princ h3{margin-top:14px;font-size:18px;line-height:24px;color:var(--ink);}
  .princ p{margin-top:6px;font-size:15px;line-height:23px;}
  .journey{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin-top:20px;padding:20px;}
  .jstep{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:4px 12px 4px 0;border:0;background:none;text-align:left;cursor:pointer;}
  .jstep::before{content:"";position:absolute;left:28px;right:0;top:18px;height:2px;background:var(--line);}
  .jstep:last-child::before{display:none;}

  /* motion */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion: reduce){ .enter,.reveal,.mk.pulse,.er .er-ic,.drafting .dot,.qa-a .reading .dot{animation:none;} }

  /* the design system's text at least 14px */
  .sv-table :is(.text-body-3,.text-caption){font-size:14px !important;}
  .sv-tag,.sv-tag .truncate{font-size:14px;}

  /* Ani, 21 Nov: no borders on cards (white fill is enough) and no sharp corners anywhere */
  .card,.notice li,.win,.alert-doc,.er,.sugg,.qa-a .body{border:0 !important;}   /* hairlines between rows stay */

  .qa-a .body{background:var(--wash);}
  .qa-a.refuse .body{background:var(--color-grey-100);}
  .card .card,.win .card{background:var(--panel);}
  .sv-scroll.sv-scroll-area,.tbl-wrap,.sv-table{border-radius:var(--radius-xs);}
  .tbl-wrap .sv-scroll.sv-scroll-area{border:0 !important;}   /* the table's own frame is a card outline too */
  @media (max-width:1200px){
    .split{grid-template-columns:minmax(0,1fr);}

  }

    .cd-steps ol::before{display:none;}
    .cd-step{width:auto;flex:none;}
    .cd-step .w,.cd-steps .cd-safe{display:none;}
    .two,.princ,.notice{grid-template-columns:minmax(0,1fr);}

    .flow{grid-template-columns:minmax(0,1fr);}
    .claimline{grid-template-columns:repeat(2,minmax(0,1fr));}

    .card-hd h2,.card-hd h3{white-space:normal;}
  }

      if(/attach/i.test(lab)){ b.remove(); return; }
      if(/send/i.test(lab)){
        b.title = 'Send the question to Cedar';
        b.addEventListener('click', function(e){ e.preventDefault(); send(); });
        box.addEventListener('input', function(){ b.disabled = !box.value.trim(); });
      }
    });
  });
}
function ask(list, text, freeKey){
  var items = list === 'askDoc' ? ASK_DOC : ASK_PT, hit = -1, t = text.toLowerCase();
  items.forEach(function(x, i){ if(hit < 0 && x.q.toLowerCase().split(/\W+/).filter(function(w){ return w.length > 4; }).filter(function(w){ return t.indexOf(w) >= 0; }).length >= 2) hit = i; });
  if(hit >= 0 && ST[list].indexOf(hit) < 0) ST[list].push(hit);
  else { ST[freeKey] = text; ST[list] = ST[list].filter(function(x){ return x !== 'free'; }).concat(['free']); }
  paint();
  var b = document.getElementById(list === 'askDoc' ? 'ask-doc' : 'ask-pt'); if(b) b.focus();
}

/* ---- Play: each step acts itself out (for presenting and recording) ---- */
function clickAct(act, v){ var el = document.querySelector('[data-act="' + act + '"]' + (v != null ? '[data-v="' + v + '"]' : '')); if(el){ ST.playing = false; el.click(); ST.playing = true; document.body.classList.add('playing'); } }
var PLAY = {
  intake: async function(){ ST.intake = fresh().intake; paint(); await wait(900); clickAct('intakePath', 'chest'); await wait(1300); clickAct('intakeAns', 'Yes, right now'); await wait(2600); },
  note: async function(){ ST.note = {signed:false, edits:{}, drafted:false}; paint(); await wait(2600); clickAct('exampleEdit'); await wait(1800); clickAct('sign'); await wait(2200); },
  code: async function(){ ST.code = fresh().code; paint(); await wait(1200); clickAct('codeOpen'); await wait(1800); clickAct('codeOpen'); await wait(600); clickAct('codeUse'); await wait(2000); },
  askdoc: async function(){ ST.askDoc = []; paint(); await wait(800); clickAct('askDoc', 0); await wait(3800); clickAct('askDoc', 2); await wait(4200); },
  askpt: async function(){ ST.askPt = []; paint(); await wait(800); clickAct('askPt', 0); await wait(3400); clickAct('askPt', 2); await wait(2800); },
  log: async function(){ ST.logF = 'all'; paint(); await wait(1400); ST.logF = 'cedar'; paint(); await wait(2200); ST.logF = 'all'; paint(); await wait(800); },
  runs: async function(){ await wait(1500); window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); await wait(2500); window.scrollTo({top:0, behavior:'smooth'}); await wait(800); }
};
async function playStep(){
  var k = STEPS[ST.step].k; if(!PLAY[k] || ST.playing) return;
  ST.playing = true; paint(); try { await PLAY[k](); } finally { ST.playing = false; paint(); }
}
var TOUR = 0;
async function playTour(){
  if(ST.playing) return;
  var id = ++TOUR;
  for(var i = 1; i < STEPS.length; i++){
    if(id !== TOUR) break;
    go(i); await wait(1400); ST.playing = true; paint();
    try { await PLAY[STEPS[i].k](); } finally { ST.playing = false; }
    if(id !== TOUR) break;
    paint(); await wait(900);
  }
}

document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]'); if(g){ go(+g.getAttribute('data-go')); return; }
  var a = e.target.closest('[data-act]'); if(!a) return;
  var act = a.getAttribute('data-act'), v = a.getAttribute('data-v'), I = ST.intake;
  switch(act){
    case 'next': go(ST.step + 1); break;
    case 'prev': go(ST.step - 1); break;
    case 'restart': TOUR++; ST = fresh(); location.hash = ''; paint(true); break;
    case 'play': playStep(); break;
    case 'tour': playTour(); break;
    case 'present': present(); break;
    case 'intakePath':
      if(v === 'other'){ I.path = 'cough'; I.answers = ['Something else']; } else { I.path = v; I.answers = [v === 'cough' ? 'A cough' : 'Chest pain or pressure']; }
      I.i = 0; paint(); break;
    case 'intakeAns':
      I.answers.push(v);
      if(DANGER[v]){ I.er = true; I.danger = v === 'Yes, right now' ? 'chest pain or pressure while resting' : v; }
      else I.i++;
      paint(); break;
    case 'intakeSend': var t = document.getElementById('in-more'); if(t && t.value.trim()) I.answers.push(t.value.trim()); I.done = true; paint(); break;
    case 'intakeReset': ST.intake = fresh().intake; paint(); break;
    case 'call911': a.textContent = 'Test mode: nothing is dialled'; break;
    case 'exampleEdit': ST.note.edits.plan = EXAMPLE_EDIT; paint(); var p = document.querySelector('.note-sec[data-sec="plan"]'); if(p) p.scrollIntoView({block:'center', behavior:'smooth'}); break;
    case 'sign': ST.note.signed = true; paint(); break;
    case 'codeUse': ST.code.pick = '786.2'; ST.code.confirmed = true; paint(); break;
    case 'codeOpen': ST.code.open = !ST.code.open; paint(); break;
    case 'codePick': ST.code.pick = v; ST.code.confirmed = true; ST.code.open = false; paint(); break;
    case 'codeChange': ST.code.confirmed = false; ST.code.open = true; paint(); break;
    case 'askDoc': case 'askPt': if(ST[act].indexOf(+v) < 0) ST[act].push(+v); paint(); var q = document.querySelector('.qa-a.typing'); if(q) q.scrollIntoView({block:'center', behavior:'smooth'}); break;
    case 'logF': ST.logF = v; paint(); break;
  }
});
/* Present: full screen, no step list; arrow keys move between steps */
function present(){
  var on = !document.body.classList.contains('present');
  document.body.classList.toggle('present', on);
  try { if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); else if(!on && document.fullscreenElement) document.exitFullscreen(); } catch(e){}
  paintTools();
}
document.addEventListener('fullscreenchange', function(){ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); paintTools(); } });
function paintTools(){
  var on = document.body.classList.contains('present');
  document.getElementById('cd-tools').innerHTML = '<span style="display:inline-flex;gap:8px">' +
    btn('tertiary-main', on ? 'Exit presenting' : 'Present', 'present', on ? 'Leave full screen and show the step list again' : 'Full screen without the step list; arrow keys move between steps', on ? 'arrow-expand-down' : 'arrow-expand-up') +
    btn('tertiary-main', 'Restart', 'restart', 'Clear everything and start the demo again', 'refresh-undo') + '</span>';
}
document.addEventListener('keydown', function(e){
  if(e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return;
  if(ST.playing) return;
  if(e.key === 'ArrowRight') go(ST.step + 1);
  if(e.key === 'ArrowLeft') go(ST.step - 1);
});
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('cd-logo').innerHTML = logo(32);
  document.getElementById('cd-mark').innerHTML = ic('ai', 18);
  document.getElementById('cd-safe-ic').innerHTML = ic('shield-check', 20);
  document.getElementById('cd-safe-tag').innerHTML = tag('information', 'Demo · test patient · nothing is saved', 'Nothing here creates a record, booking or claim, and nothing is sent', 'shield-check');
  paintTools();
  var h = (location.hash || '').slice(1), i = STEPS.map(function(s){ return s.k; }).indexOf(h);
  ST.step = i > 0 ? i : 0;
  paint();
});
</script>
