<!--
  SimpleCare billing agent portal (Ani, 6 Oct 2026).
  Daniel, 5 Oct: rejections are handled by a billing agent, a separate role from the MOA ("can be the same person").
  The doctor is always ultimately responsible. Full service. The billing agent in this prototype is Japneet.
  Same look as simplecare-physician-portal-v2.html: its tokens, system font, Mage icons, slim summary strip,
  underline tabs with count badges, side drawers from the right, sentence case. Light only (Ani, 4 Oct).
  Data: MSP fee codes (13x37 / 13x38, MSP fee file 1 Jul 2026), MSP explanatory codes (MSP list dated 1 Jul 2026,
  public subset in assets/data/msp-explanatory-codes.json), MSP's 2026 close-off and payment calendar (gov.bc.ca).
  The patients and claims are the physician portal's demo patients plus a few more; no PHN, no date of birth.
  Spec: product/specs/billing-portal.md
-->

  .sidebar{position:sticky;top:0;height:100vh;width:220px;flex:none;display:flex;flex-direction:column;padding:22px 16px;}
  .brand{display:flex;align-items:center;gap:10px;margin:0 0 9px 2px;height:66px;}
  .brand img{width:132px;height:66px;display:block;}
  .brand .role{font-size:16.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .brand .role::before{content:"·";margin-right:8px;color:var(--ink-faint);}
  .nav{display:flex;flex-direction:column;gap:2px;margin:auto 0;}
  .nav-btn{display:flex;align-items:center;gap:11px;width:100%;height:42px;padding:9px 12px;border:0;border-radius:9px;background:none;
    font-size:15.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;text-align:left;}
  .nav-btn .ic{width:24px;height:24px;color:var(--ink-faint);}
  .nav-btn:hover:not(.active){background:rgba(23,24,28,.05);}
  .nav-btn.active{background:var(--ink);color:#fff;font-weight:600;}
  .nav-btn.active .ic{color:#fff;}
  .nav-n{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--badge);color:#fff;font-size:14px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;}
  .side-foot{font-size:14px;color:var(--ink-soft);line-height:1.45;padding:0 12px;}
  .main{flex:1;min-width:0;padding:0 0 34px;}
  .topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:14px 34px 20px;margin:0 0 6px;
    background:rgba(226,229,233,.82);-webkit-backdrop-filter:saturate(1.5) blur(22px);backdrop-filter:saturate(1.5) blur(22px);}
  .tb-title{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .tb-pill{display:flex;align-items:center;gap:10px;height:54px;padding:6px 18px 6px 6px;border-radius:999px;background:var(--panel);box-shadow:0 1px 2px rgba(23,24,28,.05);}
  .tb-pill .tb-ic{width:42px;height:42px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;}
  .tb-pill .tb-ic .ic{width:22px;height:22px;}
  .tb-pill b{display:block;font-size:15px;font-weight:600;}
  .tb-pill span.t{display:block;font-size:14px;color:var(--ink-soft);}
  .profile{position:relative;}
  .profile-btn{display:flex;align-items:center;gap:10px;height:54px;padding:6px 12px 6px 6px;border:0;border-radius:999px;background:var(--panel);
    box-shadow:0 1px 2px rgba(23,24,28,.05);cursor:pointer;color:var(--ink);}
  .avatar{position:relative;width:42px;height:42px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);font-size:16px;font-weight:800;
    display:flex;align-items:center;justify-content:center;}
  .avatar::after{content:"";position:absolute;right:0;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2.5px #fff;}
  .profile-btn .who{text-align:left;line-height:1.25;}
  .profile-btn .who b{display:block;font-size:15px;}
  .profile-btn .who span{display:block;font-size:14px;color:var(--ink-soft);}
  .profile-btn .ic{width:24px;height:24px;}
  .menu{position:absolute;right:0;top:62px;width:280px;background:var(--panel);border-radius:14px;box-shadow:0 12px 32px rgba(23,24,28,.16);padding:8px;display:none;z-index:80;}
  .menu.show{display:block;}
  .menu .mh{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .menu .mh b{display:block;font-size:15.5px;}
  .menu .mh span{display:block;font-size:14px;color:var(--ink-soft);line-height:1.5;}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px;border:0;background:none;border-radius:8px;font-size:15px;color:var(--ink);cursor:pointer;}
  .menu button:hover{background:var(--wash);}
  .menu button .ic{width:20px;height:20px;color:var(--ink-faint);}
  .content{padding:22px 34px 0;}
  .screen{display:none;padding:0 0 104px;}
  .screen.active{display:block;}
  h1{font-size:33px;font-weight:800;letter-spacing:-.022em;margin:0 0 4px;}
  .sub{font-size:15.5px;color:var(--ink-soft);margin:0 0 18px;max-width:80ch;line-height:1.45;}

  /* slim summary strip */
  .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;}
  .strip .cell{padding:10px 16px;min-width:0;}
  .strip .cell + .cell{border-left:1px solid var(--line);}
  .strip .k{font-size:14px;font-weight:500;color:var(--ink-soft);margin:0 0 2px;}
  .strip .vs{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0;}
  .strip .v{font-size:20px;font-weight:700;line-height:24px;letter-spacing:-.01em;}
  .strip .s{font-size:14px;color:var(--ink-soft);}
  button.cell{all:unset;box-sizing:border-box;padding:10px 16px;min-width:0;cursor:pointer;border-radius:12px;}
  button.cell:hover{background:var(--wash);}
  button.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .strip button.cell + button.cell{border-left:1px solid var(--line);border-radius:0;}

  /* underline tabs with count badges */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto;}
  .tab{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 14px;margin:0 0 -1px;border:0;border-bottom:3px solid transparent;background:none;
    font-size:15px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);}
  .tab:hover:not([aria-selected="true"]){color:var(--ink);}
  .tab-n{min-width:24px;height:24px;padding:0 7px;border-radius:12px;font-size:14px;font-weight:700;background:var(--crit);color:#fff;display:inline-flex;align-items:center;justify-content:center;}
  .tab-n.neu{background:var(--wash);color:var(--ink-soft);font-weight:600;}

  /* panels and cards */
  .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin:0 0 16px;box-shadow:var(--shadow-card);}
  .panel-note{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.5;color:var(--ink);background:var(--wash);border-radius:12px;padding:12px 14px;margin:0 0 4px;}
  .panel-note .ic{width:20px;height:20px;color:var(--tag-warn-ic);margin-top:1px;}
  .panel-note.info .ic{color:var(--tag-info-ic);}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0 0;background:var(--panel);}
  .card:first-child{margin-top:0;}
  .card.hl{outline:2px solid var(--accent);outline-offset:3px;}
  .chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:40px;margin:0 0 4px;}
  .chead b{font-size:15.5px;font-weight:700;}
  .chead .vd{font-size:14px;color:var(--ink-soft);}
  .chips{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .meta{font-size:14px;color:var(--ink-soft);margin:0 0 6px;line-height:1.5;}
  .why{font-size:15px;line-height:1.5;margin:0;max-width:96ch;}
  .why .code{font-weight:700;}
  .line2{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;line-height:1.5;color:var(--ink-soft);margin:6px 0 0;max-width:96ch;}
  .line2 .ic{width:18px;height:18px;margin-top:1px;color:var(--ink-faint);}
  .line2.ans .ic{color:var(--good);}
  .line2 q{quotes:"“" "”" "‘" "’";color:var(--ink);}
  .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);}
  .empty{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-soft);padding:8px 2px;}
  .empty .ic{width:22px;height:22px;color:var(--good);}

  /* buttons: 44 px with an icon; secondary is an outline */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--panel);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--wash);}
  .btn .ic{width:18px;height:18px;}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  .btn.quiet{border-color:transparent;background:none;color:var(--ink-soft);padding:0 12px;}
  .btn.quiet:hover{background:var(--wash);color:var(--ink);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* tags: one spec (15/500, 40 px), barely tinted, no stroke */
  .tag{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink);background:var(--wash);white-space:nowrap;}
  .tag .ic{width:16px;height:16px;color:var(--ink-faint);}
  .tag.warn{background:var(--tag-warn);} .tag.warn .ic{color:var(--tag-warn-ic);}
  .tag.info{background:var(--tag-info);} .tag.info .ic{color:var(--tag-info-ic);}
  .tag.ok{background:var(--good-wash);} .tag.ok .ic{color:var(--good);}
  .days{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;background:var(--wash);font-size:14px;font-weight:500;white-space:nowrap;}
  .days .ic{width:16px;height:16px;color:var(--ink-faint);}
  .days.warn{background:var(--tag-warn);} .days.warn .ic{color:var(--tag-warn-ic);}
  .days.strong{background:var(--warn-wash);font-weight:700;} .days.strong .ic{color:var(--warn);}
  .days.crit{background:var(--crit-wash);color:var(--crit-ink);font-weight:700;} .days.crit .ic{color:var(--crit);}

  /* remittance */
  .coming{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;}
  .coming .tb-pill{height:auto;min-height:54px;padding:6px 18px 6px 6px;}
  .stmt-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;}
  .stmt-head h2{font-size:18px;font-weight:700;margin:0;}
  .stmt-head .s{font-size:14.5px;color:var(--ink-soft);}
  .recon{font-size:15px;line-height:1.5;margin:0 0 14px;max-width:96ch;}
  table.lines{width:100%;border-collapse:collapse;font-size:14.5px;}
  table.lines th{text-align:left;font-size:14px;font-weight:600;color:var(--ink-soft);padding:0 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.lines td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45;}
  table.lines tr:last-child td{border-bottom:0;}
  table.lines th.num,table.lines td.num{text-align:right;white-space:nowrap;}
  table.lines td.pt{min-width:170px;}
  table.lines td.pt b{display:block;font-weight:600;white-space:nowrap;}
  table.lines td.pt span{white-space:nowrap;}
  table.lines td.pt span{display:block;color:var(--ink-soft);}
  table.lines td.res{min-width:200px;}
  table.lines td.res .r{display:flex;align-items:flex-start;gap:6px;font-weight:500;}
  table.lines td.res .r .ic{width:18px;height:18px;margin-top:1px;color:var(--ink-faint);}
  table.lines td.res .r.ok .ic{color:var(--good);}
  table.lines td.res .r.warn .ic{color:var(--tag-warn-ic);}
  table.lines td.res .n{display:block;color:var(--ink-soft);margin-top:2px;}
  table.lines td.said{min-width:240px;}
  table.lines td.res .ra{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  table.lines td.res .ra .btn{min-height:40px;padding:0 14px;}
  table.lines td.res .ra .btn.quiet{padding:0 10px;margin-left:-10px;}
  table.lines td.res .ra .btn:not(.quiet) + .btn.quiet{margin-left:0;}
  table.lines tfoot td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:0;}
  .msp{display:block;}
  .msp b{font-weight:700;}

  /* side drawers from the right (same pattern as the physician portal) */
  .drw-ov{display:none;position:fixed;inset:0;z-index:200;background:rgba(23,24,28,.42);justify-content:flex-end;align-items:stretch;}
  .drw-ov.show{display:flex;animation:drwFade 240ms ease-out;}
  .drw-ov.stacked{background:rgba(23,24,28,.16);animation:none;}
  .drw{width:min(560px,100vw);height:100%;background:var(--panel);border-radius:16px 0 0 16px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:-18px 0 44px rgba(23,24,28,.16);animation:drwIn 240ms ease-out;}
  @keyframes drwIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes drwFade{from{background-color:rgba(23,24,28,0);}}
  @media (prefers-reduced-motion:reduce){.drw-ov.show,.drw{animation:none;}}
  .drw-hd{flex:none;position:relative;padding:20px 72px 16px 24px;border-bottom:1px solid var(--line);}
  .drw-hd .eyebrow{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .drw-hd h2{font-size:20px;font-weight:800;line-height:1.3;margin:0 0 6px;}
  .drw-hd .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .drw-hd .who b{color:var(--ink);}
  .drw-x{position:absolute;top:14px;right:16px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:none;color:var(--ink-soft);cursor:pointer;}
  .drw-x:hover{background:var(--wash);color:var(--ink);}
  .drw-x .ic{width:22px;height:22px;}
  .drw-bd{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 24px 24px;}
  .drw-ft{flex:none;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--panel);}
  .blk{background:var(--wash);border-radius:10px;padding:12px 14px;margin:0 0 10px;}
  .blk-k{font-size:14px;font-weight:700;margin:0 0 6px;}
  .blk p{font-size:14.5px;line-height:1.55;margin:0 0 6px;}
  .blk p:last-child{margin-bottom:0;}
  .row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:7px 0;font-size:14.5px;line-height:1.5;}
  .row + .row{border-top:1px solid var(--line);}
  .row .k{font-size:14px;color:var(--ink-soft);}
  .row .v{color:var(--ink);}
  .row .v s{color:var(--ink-soft);}
  details{margin:6px 0 0;font-size:14.5px;}
  details summary{cursor:pointer;color:var(--accent-ink);font-weight:500;padding:4px 0;}
  details p{margin:6px 0 0;line-height:1.55;color:var(--ink-soft);}
  .tl{list-style:none;margin:4px 0 0;padding:0;}
  .tl li{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:0 0 14px;}
  .tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line);}
  .tl .dot{width:28px;height:28px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);}
  .tl .dot .ic{width:16px;height:16px;}
  .tl .dot.warn{color:var(--tag-warn-ic);} .tl .dot.ok{color:var(--good);} .tl .dot.info{color:var(--tag-info-ic);}
  .tl .t{font-size:14.5px;line-height:1.5;}
  .tl .t b{font-weight:600;}
  .tl .w{display:block;font-size:14px;color:var(--ink-soft);}
  .tl .x{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:2px;}
  .tl .x q{quotes:"“" "”";}
  .fld{margin:0 0 14px;}
  .fld > label,.fld > .lbl{display:block;font-size:14.5px;font-weight:600;margin:0 0 6px;}
  .fld .hint{display:block;font-size:14px;color:var(--ink-soft);margin:0 0 6px;line-height:1.5;}
  .fld input[type=text],.fld textarea,.fld select{width:100%;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;min-height:44px;}
  .fld textarea{min-height:96px;resize:vertical;line-height:1.5;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .fld .err{display:none;font-size:14px;color:var(--crit-ink);margin:6px 0 0;}
  .fld.bad .err{display:block;}
  .fld.bad input,.fld.bad textarea{border-color:var(--crit);}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .grid3 label{display:block;font-size:14px;color:var(--ink-soft);margin:0 0 4px;}
  .radios{display:flex;flex-direction:column;gap:6px;}
  .radios label{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--wash);cursor:pointer;}
  .radios input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none;}
  .status{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;line-height:1.5;margin:8px 0 0;}
  .status .ic{width:18px;height:18px;margin-top:1px;color:var(--good);}
  .status.warn .ic{color:var(--tag-warn-ic);}
  .notice{display:flex;align-items:flex-start;gap:10px;background:var(--tag-info);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:14.5px;line-height:1.55;}
  .notice .ic{width:20px;height:20px;color:var(--tag-info-ic);margin-top:1px;}
  .notice.warn{background:var(--tag-warn);} .notice.warn .ic{color:var(--tag-warn-ic);}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:400;background:var(--ink);color:#fff;border-radius:10px;padding:12px 18px;font-size:15px;
    box-shadow:0 10px 30px rgba(23,24,28,.25);display:none;max-width:min(640px,calc(100vw - 32px));line-height:1.45;}
  #toast.show{display:block;}

  @media (max-width:1100px){
    .sidebar{width:72px;padding:22px 12px;}
    .brand img,.brand .role,.nav-btn .lbl,.side-foot{display:none;}
    .brand{justify-content:center;margin-left:0;}
    .nav-btn{justify-content:center;padding:9px 0;position:relative;}
    .nav-n{position:absolute;top:-4px;right:-4px;}
    .strip{grid-template-columns:repeat(2,minmax(0,1fr));}
    .tb-pill.close-off{display:none;}
  }
  /* Ani, 7 Oct copy diet: help text that is still needed sits behind a small info icon */
  .tip{display:inline-flex;vertical-align:middle;width:20px;height:20px;color:var(--ink-faint);cursor:help;border-radius:50%;}
  .tip .ic{width:20px;height:20px;}
  .tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* the subtitles under the page titles are gone, so the title carries the gap they used to give */
  #screen-queue h1,#screen-remit h1{margin-bottom:18px;}
  h1 .tip{width:22px;height:22px;margin-left:4px;}
  /* build stamp: which version is loaded (rule 24a) */
  .build-stamp{position:fixed;left:8px;bottom:4px;z-index:5;font-size:14px;color:rgba(23,24,28,.28);pointer-events:none;}
  h1 .tip .ic{width:22px;height:22px;}

  /* Ani, 7 Oct: "from the MOA portal there's no way back to the doctor dashboard" -> Switch portal in the profile menu */
  #profile-menu .menu-lbl{margin:4px 0 2px;padding:6px 12px 4px;font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line);}
  #profile-menu .sw-item{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px;font-size:15px;color:var(--ink);text-decoration:none;}
  #profile-menu a.sw-item:hover,#profile-menu [role=menuitem]:focus-visible{background:var(--wash);outline:none;}
  #profile-menu .sw-cur{font-weight:600;cursor:default;}
  #profile-menu .sw-tick{width:20px;height:20px;margin-left:auto;color:var(--accent);}
  #profile-menu .menu-sep{border-top:1px solid var(--line);margin:6px 0;}
</style>
</head>

<div class="app">
  <aside class="sidebar" aria-label="Billing">
    <div class="brand"><img src="assets/brand-logo.svg" alt="SimpleCare"><span class="role">Billing</span></div>
    <nav class="nav" aria-label="Main">
      <button type="button" class="nav-btn active" data-screen="queue" onclick="go('queue')" aria-current="page"><span class="ic" data-ic="claims"></span><span class="lbl">Work queue</span><span class="nav-n" id="nav-n-queue"></span></button>
      <button type="button" class="nav-btn" data-screen="remit" onclick="go('remit')"><span class="ic" data-ic="earnings"></span><span class="lbl">Remittance</span></button>
    </nav>
    <p class="side-foot">Dr. Daniel Pannozzo</p>
  </aside>

  <div class="main">
    <header class="topbar">
      <p class="tb-title" id="tb-title">Work queue</p>
      <div class="tb-right">
        <div class="tb-pill close-off" title="MSP's 2026 schedule: claims sent by 7 PM on the close-off date are paid on the matching payment date">
          <span class="tb-ic"><span class="ic" data-ic="calendar"></span></span>
          <span><b id="tb-cut"></b><span class="t" id="tb-pay"></span></span>
        </div>
        <div class="profile">
          <button type="button" class="profile-btn" id="profile-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu" onclick="toggleMenu()">
            <span class="avatar" aria-hidden="true">J</span>
            <span class="who"><b>Japneet</b><span>Billing agent</span></span>
            <span class="ic" data-ic="chevrondown"></span>
          </button>
          <div class="menu" id="profile-menu" role="menu" aria-label="Account">
            <div class="mh" role="presentation"><b>Japneet</b><span>Billing agent</span><span>Dr. Pannozzo is responsible for every claim.</span></div>
            <p class="menu-lbl" role="presentation" id="sw-lbl">Switch portal</p>
            <div role="group" aria-labelledby="sw-lbl"><a role="menuitem" tabindex="-1" class="sw-item" href="simplecare-physician-portal-v2.html">Doctor</a><a role="menuitem" tabindex="-1" class="sw-item" href="simplecare-moa-portal.html">MOA</a><span role="menuitem" tabindex="-1" class="sw-item sw-cur" aria-current="page" aria-disabled="true">Billing<svg class="ic sw-tick" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><a role="menuitem" tabindex="-1" class="sw-item" href="simplecare-patient-portal-v2.html">Patient</a></div>
            <div class="menu-sep" role="separator"></div>
            <button type="button" role="menuitem" tabindex="-1" onclick="location.href='simplecare-login.html?next=simplecare-billing-portal.html'"><span class="ic" data-ic="logout"></span>Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- ===== Work queue (default) ===== -->
      <section class="screen active" id="screen-queue" aria-labelledby="h-queue">
        <!-- Ani, 7 Oct copy diet: the explainer subtitle is now the tooltip -->
        <h1 id="h-queue">Work queue <span id="h-queue-tip"></span></h1>
        <div class="strip" id="q-strip"></div>
        <div class="tabs" role="tablist" aria-label="Work queue" id="q-tabs"></div>
        <div id="q-panels"></div>
      </section>

      <!-- ===== Remittance ===== -->
      <section class="screen" id="screen-remit" aria-labelledby="h-remit">
        <h1 id="h-remit">Remittance</h1>
        <div class="coming" id="r-coming"></div>
        <div class="strip" id="r-strip"></div>
        <div class="tabs" role="tablist" aria-label="Statement lines" id="r-tabs"></div>
        <div id="r-panels"></div>
      </section>
    </main>
  </div>
</div>

<!-- drawers: claim detail, fix and resend, ask the doctor, mark closed -->

/* resend window: 90 days from the date of the C12 or statement that refused it (MSP "Submission of claims";
   Dev answer 03). Day counts are whole calendar days from today. */
function deadline(c){ return c.refusedOn ? plus(c.refusedOn, 90) : null; }
function daysLeft(c){ var d = deadline(c); return d ? diff(TODAY, d) : null; }
function daysChip(c){
  var n = daysLeft(c); if(n == null) return '';
  var cls = n <= 2 ? 'crit' : n <= 5 ? 'strong' : n <= 10 ? 'warn' : '';
  var w = n < 0 ? 'Past the resend window' : n === 0 ? 'Last day today' : n === 1 ? '1 day left' : n + ' days left';
  var tip = 'Last day ' + fdw(deadline(c)) + '. 90 days from the ' + (c.src === 'stmt' ? 'statement' : 'MSP refusal') + ' of ' + fd(c.refusedOn) + '.';
  return '<span class="days ' + cls + '" title="' + esc(tip) + '">' + ic(n <= 5 ? 'alert' : 'clock') + '<span>' + w + '<span class="sr">. ' + esc(tip) + '</span></span></span>';
}
function fixer(c){ if(c.answer) return 'agent'; var e = exMain(c); return e ? e.fixer : 'agent'; }
function feeTxt(c){ return c.fee + ' · ' + FEES[c.fee].n; }
function dxTxt(c){ return c.dx ? c.dx + ' · ' + (DX[c.dx] || '') : 'No diagnosis'; }
function refusedWhere(c){ return c.src === 'stmt' ? 'on ' + fd(c.refusedOn) + ' statement' : fd(c.refusedOn) + ', pre-edit'; }
function stLabel(c){
  return {refused:'Refused', waiting:'Waiting on doctor', held:'Held by MSP', resent:'Resent · waiting on MSP',
          paid:'Paid', adjusted:'Paid ' + (c.paid != null ? money(c.paid) + ' of ' + money(c.billed) : ''), closed:'Closed — not paid', approval:'Waiting on doctor'}[c.st] || c.st;
}
function inRun(c){ return c.resentOn ? runFor(c.resentOn) : null; }

function stmtLines(){ return CLAIMS.filter(function(c){ return c.onStmt; }); }
function lineKind(c){

  if(c.ex && c.ex[0] === 'BH') return 'held';

function linePaid(c){ var k = lineKind(c); return k === 'paid' ? c.billed : k === 'diff' ? c.paid : 0; }
function rList(k){
  var l = stmtLines();
  if(k === 'attn') l = l.filter(function(c){ return lineKind(c) !== 'paid'; });
  if(k === 'matched') l = l.filter(function(c){ return lineKind(c) === 'paid'; });
  return l.sort(function(a, b){ return a.who < b.who ? -1 : a.who > b.who ? 1 : D(a.date) - D(b.date); });

function renderRemit(){

  });

function nowWhere(c){
  /* where the claim is now in SimpleCare, after this line was applied */
  var k = lineKind(c);
  if(k === 'paid') return '<span class="r ok">' + ic('complete') + 'Matched</span>';
  if(c.st === 'refused') return '<span class="r warn">' + ic('alert') + 'In queue</span><span class="n">' + (daysLeft(c)) + ' days left</span>';
  if(c.st === 'held') return '<span class="r warn">' + ic('clock') + 'Held by MSP</span><span class="n">Don’t resend</span>';

/* ============================================================
   Drawers: one stack. Escape and the backdrop close the top one; focus moves in, is trapped, and returns.
   ============================================================ */
var STACK = [];
var FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function drwOpen(id, html, focusSel){
  var ov = document.getElementById(id), card = ov.firstElementChild;
  var trig = document.activeElement && document.activeElement !== document.body && !ov.contains(document.activeElement) ? document.activeElement : null;
  var already = STACK.some(function(l){ return l.id === id; });
  card.innerHTML = html; paint(card);
  if(!already){
    STACK.push({id:id, trigger:trig, sig:trig && trig.getAttribute('onclick')});
    ov.style.zIndex = 220 + STACK.length * 10;
    ov.classList.toggle('stacked', STACK.length > 1);
    ov.classList.add('show'); ov.setAttribute('aria-hidden', 'false');
  }
  setTimeout(function(){
    var f = (focusSel && card.querySelector(focusSel)) || card.querySelector('.drw-x');
    if(f) f.focus();
  }, 30);
}
function drwClose(id){
  var k = -1; STACK.forEach(function(l, i){ if(l.id === id) k = i; }); if(k < 0) return;
  var l = STACK.splice(k, 1)[0], ov = document.getElementById(id);
  ov.classList.remove('show', 'stacked'); ov.setAttribute('aria-hidden', 'true'); ov.style.zIndex = '';
  var t = l.trigger;
  if(t && !document.contains(t) && l.sig){ t = document.querySelector('[onclick="' + l.sig.replace(/"/g, '\\"') + '"]'); }
  var top = STACK.length ? document.getElementById(STACK[STACK.length - 1].id) : null;
  if(t && document.contains(t) && t.getClientRects().length && (!top || top.contains(t))) t.focus();
  else if(top){ var x = top.querySelector('.drw-x'); if(x) x.focus(); }
}
function drwCloseAll(){ while(STACK.length) drwClose(STACK[STACK.length - 1].id); }
document.querySelectorAll('.drw-ov').forEach(function(ov){
  ov.addEventListener('mousedown', function(e){ if(e.target === ov) drwClose(ov.id); });
});
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && document.getElementById('profile-menu').classList.contains('show')){ toggleMenu(false); document.getElementById('profile-btn').focus(); return; }
  if(!STACK.length) return;
  var ov = document.getElementById(STACK[STACK.length - 1].id);
  if(e.key === 'Escape'){ e.preventDefault(); drwClose(ov.id); return; }
  if(e.key !== 'Tab') return;
  var f = Array.prototype.slice.call(ov.querySelectorAll(FOCUSABLE)).filter(function(x){ return x.getClientRects().length; });
  if(!f.length) return;
  var a = document.activeElement, first = f[0], last = f[f.length - 1];
  if(!ov.contains(a)){ e.preventDefault(); first.focus(); }
  else if(e.shiftKey && a === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && a === last){ e.preventDefault(); first.focus(); }
}, true);
function drwHead(id, eyebrow, title, c, extra){
  return '<div class="drw-hd"><p class="eyebrow">' + eyebrow + '</p><h2 id="' + id + '-t">' + title + '</h2>' +
    (c ? '<p class="who"><span><b>' + esc(c.who) + '</b> · ' + fd(c.date) + ' visit</span>' + (extra || '') + '</p>' : '') +
    '<button type="button" class="drw-x" aria-label="Close" onclick="drwClose(\'' + id + '\')">' + ic('close') + '</button></div>';
}
function row(k, v){ return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function mspBlock(c, withDeadline){
  var e = exMain(c); if(!e) return '';
  var title = c.st === 'held' ? 'MSP · held on ' + fd(c.heldOn) + ' statement' :
              c.st === 'adjusted' || lineKind(c) === 'dup' ? 'MSP · 29 Sep statement' :
              c.refusedOn ? 'MSP · refused ' + refusedWhere(c) : 'MSP';
  var h = '<div class="blk"><p class="blk-k">' + title + '</p>' + row('Code', exCode(c)) + row('Meaning', esc(e.p)) + row('Who', esc(e.who)) + row('How', esc(e.how)) +
    '<details><summary>MSP’s words</summary>' + (c.ex || []).map(function(x){ return '<p>' + x + ' · ' + esc(EX[x] ? EX[x].w : '') + '</p>'; }).join('') + '</details>';
  if(withDeadline && c.refusedOn && ['refused','waiting'].indexOf(c.st) > -1){
    var n = daysLeft(c);
    /* Ani, 7 Oct copy diet: the days-left chip is in the header; how the deadline is counted stays one click away */
    h += '<details style="margin-top:8px"><summary>' + (n >= 0 ? 'Last day to resend: ' + fdw(deadline(c)) : 'Past the resend window') + '</summary><p>MSP allows a resend, with code X and a note, within 90 days of the refusal. ' +
      'Refused ' + fd(c.refusedOn) + ', so the last day ' + (n >= 0 ? 'is ' : 'was ') + fdw(deadline(c)) + '.</p></details>';
  }
  return h + '</div>';
}

/* ---- Claim drawer: full detail and the history timeline ---- */
function openClaim(id){
  var c = C(id); if(!c) return;
  var st = stLabel(c);
  var amt = c.st === 'paid' ? money(c.paid) + ' paid' : c.st === 'adjusted' ? money(c.paid) + ' paid of ' + money(c.billed) + ' billed' : money(c.billed) + ' billed' + (['closed'].indexOf(c.st) > -1 ? ', not paid' : '');
  var h = drwHead('drw-claim', 'MSP claim', st, c, ['refused','waiting'].indexOf(c.st) > -1 ? daysChip(c) : '');
  h += '<div class="drw-bd" tabindex="-1">';
  if(c.st === 'held') h += '<p class="notice warn">' + ic('clock') + '<span><b>Don’t resend.</b></span></p>';
  if(c.st === 'resent'){ var run = inRun(c); h += '<p class="notice">' + ic('clock') + '<span>Resent ' + fd(c.resentOn) + ' (code X). Answer on the ' + fdw(run[1]) + ' statement.</span></p>'; }
  if(c.st === 'waiting') h += '<p class="notice">' + ic(c.q.kind === 'writeoff' ? 'flag' : 'chat') + '<span>' + (c.q.kind === 'writeoff' ? 'Write-off sent ' : 'Asked ') + c.q.asked + ' · due ' + fdw(c.q.due) + '</span></p>';
  if(c.answer && c.st === 'refused') h += '<p class="notice">' + ic('chat') + '<span>' + DOC + ' answered ' + c.answer.on + ': “' + esc(c.answer.text) + '” Ready to resend.</span></p>';
  h += mspBlock(c, true);
  h += '<div class="blk"><p class="blk-k">Claim</p>' +
    row('Doctor', 'Dr. Daniel Pannozzo') +
    row('Fee code', esc(feeTxt(c)) + '<br><span style="color:var(--ink-soft)">Age ' + c.age + '</span>') +
    row('Diagnosis (ICD-9)', esc(dxTxt(c))) +
    row('Time', c.answer ? esc(c.answer.nw) : c.time ? c.time : 'Missing') +
    row('Amount', amt) +
    (c.billedName ? row('Billed name', esc([c.billedName.f, c.billedName.m, c.billedName.l].filter(Boolean).join(' '))) : '') +
    (c.note ? row('Note to MSP', esc(c.note)) : '') + '</div>';
  var hist = c.hist.slice().reverse();
  h += '<div class="blk"><p class="blk-k">History</p><ol class="tl">' + hist.map(function(ev){
    var t = EV[ev.type] || EV.created;
    return '<li><span class="dot ' + t.tone + '">' + ic(t.ic) + '</span><span class="t"><b>' + esc(ev.text) + '</b><span class="w">' + esc(ev.when) + ' · ' + esc(ev.who) + '</span>' +
      (ev.extra ? '<span class="x">' + (ev.type === 'resent' || ev.type === 'question' || ev.type === 'answer' || ev.type === 'writeoff' ? '<q>' + esc(ev.extra) + '</q>' : esc(ev.extra)) + '</span>' : '') + '</span></li>';
  }).join('') + '</ol></div>';
  h += '</div><div class="drw-ft"><button type="button" class="btn" onclick="drwClose(\'drw-claim\')">Close</button>';
  if(c.st === 'refused'){
    if(fixer(c) === 'doctor') h += '<button type="button" class="btn pri" onclick="openAsk(\'' + c.id + '\')">' + ic('chat') + 'Ask doctor</button>';
    else h += '<button type="button" class="btn pri" onclick="openFix(\'' + c.id + '\')">' + ic('reopen') + 'Fix & resend</button>';
  }
  if(c.st === 'adjusted') h += '<button type="button" class="btn pri" onclick="openAsk(\'' + c.id + '\')">' + ic('chat') + 'Ask doctor</button>';
  h += '</div>';
  drwOpen('drw-claim', h);
}

/* ---- Fix and resend (code X + note) ---- */
var NOTE = {
  AM:'Resubmission of a claim refused AM. Patient name corrected to match MSP’s records.',
  AQ:'Resubmission of a claim refused AQ. Patient last name corrected to match MSP’s records.',
  BJ:'Resubmission of a claim refused BJ. Re-priced to MSP’s fee for the fee code.',
  YA:'Resubmission of a claim refused AM, then YA. Patient name confirmed by MSP. Note attached.',
  CF:'Resubmission of a claim refused CF. Call start and end times added by the physician.',
  AF:'Resubmission of a claim refused AF. Patient’s MSP coverage for the visit date confirmed.'
};
function openFix(id){
  var c = C(id); if(!c) return;
  var main = (c.ex || []).filter(function(x){ return WRAP.indexOf(x) < 0; })[0];
  var h = drwHead('drw-fix', 'Refused claim', 'Fix & resend', c, daysChip(c));
  h += '<div class="drw-bd" tabindex="-1">';
  var e = exMain(c);
  h += '<div class="blk"><p class="blk-k">MSP said</p><p><b>' + exCode(c) + '</b> · ' + esc(e.p) + '</p></div>';
  var focus = '#fx-note';
  if(main === 'AM' || main === 'AQ'){
    var b = c.billedName, m = c.mspName;
    h += '<div class="fld"><span class="lbl" id="fx-name-l">Legal name, as MSP has it</span>' +
      '<div class="grid3" role="group" aria-labelledby="fx-name-l"><div><label for="fx-f">First name</label><input type="text" id="fx-f" value="' + esc(b.f) + '" oninput="fxNameChanged()"></div>' +
      '<div><label for="fx-m">Middle name</label><input type="text" id="fx-m" value="' + esc(b.m) + '" oninput="fxNameChanged()"></div>' +
      '<div><label for="fx-l">Last name</label><input type="text" id="fx-l" value="' + esc(b.l) + '" oninput="fxNameChanged()"></div></div>' +
      (m ? '<p class="status">' + ic('usercheck') + '<span>MSP name check, ' + m.on + ': <b>' + esc([m.f, m.m, m.l].filter(Boolean).join(' ')) + '</b>. ' +
        '<button type="button" class="btn" style="min-height:36px;margin-top:6px" onclick="fxUseMsp(\'' + c.id + '\')">' + ic('usercheck') + 'Use MSP’s name</button></span></p>' : '') +
      '<p class="err" id="fx-name-err">Doesn’t match MSP’s name.</p></div>';
    focus = '#fx-f';
  } else if(main === 'BJ'){
    var a = FEES[c.fee].a;
    h += '<div class="fld"><span class="lbl">Amount</span>' + row('Billed', '<s>' + money(c.billed) + '</s>') + row('Corrected', '<b>' + money(a) + '</b> · MSP’s fee for ' + c.fee) +
      '<span class="hint">From MSP’s fee file. Fee code unchanged.</span></div>';
  } else if(main === 'YA'){
    h += '<p class="notice">' + ic('chartnote') + '<span>Claim was right (name confirmed 25 Sep). Add the missing note.</span></p>';
  } else if(main === 'CF' && c.answer){
    h += '<div class="fld"><span class="lbl">Changed by ' + DOC + ' on ' + c.answer.on + '</span>' + row(c.answer.field, '<s>' + esc(c.answer.old) + '</s> → <b>' + esc(c.answer.nw) + '</b>') + '</div>';
  } else if(main === 'AF'){
    h += '<div class="fld"><span class="lbl">Coverage on ' + fd(c.date) + '</span>' +
      '<button type="button" class="btn" id="fx-elig" onclick="fxElig(\'' + c.id + '\')">' + ic('usercheck') + 'Check coverage with MSP</button><div id="fx-elig-out" aria-live="polite"></div></div>';
    focus = '#fx-elig';
  }
  h += '<div class="fld">' + row('Submission code', '<b>X</b> ' + tip('Every resend of a refused claim needs code X and a note. Without a note MSP refuses it (YY · YA). The visit date stays the same.')) + '</div>';
  h += '<div class="fld" id="fx-note-f"><label for="fx-note">Note to MSP</label>' +
    '<textarea id="fx-note" aria-describedby="fx-note-err">' + esc(NOTE[main] || 'Resubmission of a refused claim.') + '</textarea><p class="err" id="fx-note-err">Add a note. Code X without one is refused.</p></div>';
  h += '<p class="status warn">' + ic('calendar') + '<span>Sent today: ' + fdw(NEXT_RUN[0]) + ' close-off, paid ' + fdw(NEXT_RUN[1]) + '.</span></p>';
  h += '</div><div class="drw-ft"><button type="button" class="btn" onclick="drwClose(\'drw-fix\')">Cancel</button>' +
    '<button type="button" class="btn pri" id="fx-go" onclick="doResend(\'' + c.id + '\')"' + (main === 'AF' ? ' disabled' : '') + '>' + ic('arrowup') + 'Resend (code X)</button></div>';
  drwOpen('drw-fix', h, focus);
}
function fxNameChanged(){ var f = document.getElementById('fx-name-err'); if(f) f.parentNode.classList.remove('bad'); }
function fxUseMsp(id){ var m = C(id).mspName; document.getElementById('fx-f').value = m.f; document.getElementById('fx-m').value = m.m; document.getElementById('fx-l').value = m.l; fxNameChanged(); document.getElementById('fx-note').focus(); }
function fxElig(id){
  var c = C(id), out = document.getElementById('fx-elig-out');
  out.innerHTML = '<p class="status warn">' + ic('alert') + '<span>MSP: no coverage on ' + fd(c.date) + ' (active to ' + fd('2026-09-06') + '). A resend won’t pay. ' +
    'Close and bill privately, or resend once coverage is fixed.</span></p>' +
    '<button type="button" class="btn" style="margin-top:8px" onclick="drwClose(\'drw-fix\');openClose(\'' + id + '\', \'coverage\')">' + ic('flag') + 'Close unpaid</button>';
  paint(out);
  if(!c.eligChecked){ c.eligChecked = true; c.hist.push(H('elig', stamp(), ME + ' (billing agent)', 'Coverage checked with MSP: no coverage on ' + fd(c.date))); }
  document.getElementById('fx-elig').disabled = true;
  out.querySelector('.btn').focus();
}
function doResend(id){
  var c = C(id), main = (c.ex || []).filter(function(x){ return WRAP.indexOf(x) < 0; })[0];
  var note = document.getElementById('fx-note'), nf = document.getElementById('fx-note-f'), ok = true;
  if(!note.value.trim()){ nf.classList.add('bad'); note.setAttribute('aria-invalid', 'true'); note.focus(); ok = false; }
  var who = ME + ' (billing agent)', t = stamp();
  if(main === 'AM' || main === 'AQ'){
    var v = {f:document.getElementById('fx-f').value.trim(), m:document.getElementById('fx-m').value.trim(), l:document.getElementById('fx-l').value.trim()};
    var m = c.mspName;
    if(m && (v.f.toLowerCase() !== m.f.toLowerCase() || v.m.toLowerCase() !== m.m.toLowerCase() || v.l.toLowerCase() !== m.l.toLowerCase())){
      document.getElementById('fx-name-err').parentNode.classList.add('bad'); if(ok) document.getElementById('fx-f').focus(); ok = false;
    }
    if(!ok) return;
    var o = [c.billedName.f, c.billedName.m, c.billedName.l].filter(Boolean).join(' '), n = [v.f, v.m, v.l].filter(Boolean).join(' ');
    if(o !== n) c.hist.push(H('edited', t, who, 'Edited billing name: ' + o + ' → ' + n));
    c.billedName = v;
  }
  if(!ok) return;
  if(main === 'BJ'){ var a = FEES[c.fee].a; c.hist.push(H('edited', t, who, 'Edited amount: ' + money(c.billed) + ' → ' + money(a))); c.billed = a; }
  if(c.answer){ c.time = c.answer.nw; }
  c.note = note.value.trim(); c.resentOn = iso(TODAY); c.st = 'resent';
  c.hist.push(H('resent', t, who, 'Resent with code X', c.note));
  drwCloseAll(); renderAll();
  toast('Resent · answer on the ' + fdw(NEXT_RUN[1]) + ' statement');
  focusQueue();
}

/* ---- Ask the doctor (coding is the doctor's) ---- */
var ASK = {
  BI:'MSP says the fee code and diagnosis don’t go together (BI). Can you check the diagnosis on this claim, or tell me it’s right as billed?',
  VN:'MSP says the diagnosis code is missing or invalid (VN). Which code should this claim have?',
  CF:'MSP needs the call start and end time on this counselling claim (CF). What were they?',
  ED:'MSP says there isn’t enough medical reason for this visit (ED). Can you write the reason, so I can ask MSP to reassess?',
  HC:'MSP paid this claim under 13437 instead of 13537 (HC). The patient was 52 on the visit date. Do you want me to dispute it?'
};
function openAsk(id){
  var c = C(id); if(!c) return;
  var main = (c.ex || []).filter(function(x){ return WRAP.indexOf(x) < 0; })[0];
  var due = [plus(TODAY, 2), plus(TODAY, 3), plus(TODAY, 7)];   /* Thu 8, Fri 9, Tue 13 Oct (Mon 12 Oct is Thanksgiving) */

function doAsk(id){
  var c = C(id), q = document.getElementById('ak-q'), f = document.getElementById('ak-q-f');
  if(!q.value.trim()){ f.classList.add('bad'); q.setAttribute('aria-invalid', 'true'); q.focus(); return; }
  var due = document.getElementById('ak-due').value;
  c.q = {kind:'q', asked:fd(TODAY), due:due, text:q.value.trim()};
  c.prevSt = c.st; c.st = 'waiting';
  c.hist.push(H('question', stamp(), ME + ' (billing agent)', 'Question to ' + DOC, c.q.text));
  drwCloseAll(); renderAll();
  toast('Sent to ' + DOC + ' · due ' + fdw(due));
  focusQueue();
}

/* ---- Mark closed — not paid (a write-off: the doctor approves) ---- */
var REASONS = [
  ['dup','Duplicate (already paid)'],
  ['late','Too late to resend'],
  ['coverage','No MSP coverage on visit date'],
  ['doctor','Doctor decided not to resend'],
  ['other','Other']
];
function openClose(id, pre){
  var c = C(id); if(!c) return;
  var h = drwHead('drw-close', 'Write-off', 'Close unpaid', c, ['refused','waiting'].indexOf(c.st) > -1 ? daysChip(c) : '');
  h += '<div class="drw-bd" tabindex="-1">' +
    '<p class="notice warn">' + ic('flag') + '<span><b>Needs ' + DOC + '’s approval.</b> The claim closes, and ' + money(c.billed) + ' is written off, only when he approves.</span></p>' +
    mspBlock(c, false) +
    '<fieldset class="fld" id="cl-r-f" style="border:0;padding:0;margin:0 0 14px"><legend class="lbl" style="font-size:14.5px;font-weight:600;margin:0 0 6px;padding:0">Reason</legend><div class="radios">' +
    REASONS.map(function(r){ return '<label><input type="radio" name="cl-r" value="' + r[0] + '"' + (pre === r[0] ? ' checked' : '') + ' onchange="document.getElementById(\'cl-r-f\').classList.remove(\'bad\')">' + r[1] + '</label>'; }).join('') +
    '</div><p class="err">Pick a reason.</p></fieldset>' +
    '<div class="fld" id="cl-n-f"><label for="cl-n">Note for the doctor (required for Other)</label><textarea id="cl-n" aria-describedby="cl-n-err">' + (pre === 'coverage' ? 'MSP says no coverage on ' + fd(c.date) + '. Suggest billing the patient privately.' : '') + '</textarea><p class="err" id="cl-n-err">Say why, for the doctor.</p></div>' +
    '</div><div class="drw-ft"><button type="button" class="btn" onclick="drwClose(\'drw-close\')">Cancel</button><button type="button" class="btn pri" onclick="doClose(\'' + c.id + '\')">' + ic('flag') + 'Send for approval</button></div>';
  drwOpen('drw-close', h, 'input[name=cl-r]');

function doClose(id){
  var c = C(id), r = document.querySelector('input[name=cl-r]:checked'), n = document.getElementById('cl-n');
  if(!r){ document.getElementById('cl-r-f').classList.add('bad'); document.querySelector('input[name=cl-r]').focus(); return; }
  if(r.value === 'other' && !n.value.trim()){ document.getElementById('cl-n-f').classList.add('bad'); n.focus(); return; }
  var why = REASONS.filter(function(x){ return x[0] === r.value; })[0][1] + (n.value.trim() ? '. ' + n.value.trim() : '');
  c.q = {kind:'writeoff', asked:fd(TODAY), due:iso(plus(TODAY, 2)), text:why};
  c.prevSt = c.st; c.st = 'waiting';
  c.hist.push(H('writeoff', stamp(), ME + ' (billing agent)', 'Write-off sent for approval', why));
  drwCloseAll(); renderAll();
  toast('Sent to ' + DOC + ' for approval');
  focusQueue();
}

function go(s){
  document.querySelectorAll('.screen').forEach(function(x){ x.classList.toggle('active', x.id === 'screen-' + s); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ var on = b.getAttribute('data-screen') === s; b.classList.toggle('active', on); if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  document.getElementById('tb-title').textContent = s === 'queue' ? 'Work queue' : 'Remittance';
  window.scrollTo(0, 0);
  try{ history.replaceState(null, '', '#' + s); }catch(e){}
}
function flash(id){
  setTimeout(function(){
    var el = document.getElementById('card-' + id); if(!el) return;
    el.scrollIntoView({block:'center'}); el.classList.add('hl');
    var b = el.querySelector('.btn'); if(b) b.focus({preventScroll:true});
    setTimeout(function(){ el.classList.remove('hl'); }, 1800);
  }, 30);
}
function focusQueue(){ var t = document.getElementById('qt-' + QTAB); if(t && document.getElementById('screen-queue').classList.contains('active')) t.focus(); }
function toggleMenu(force){
  var m = document.getElementById('profile-menu'), b = document.getElementById('profile-btn');
  var on = typeof force === 'boolean' ? force : !m.classList.contains('show');
  m.classList.toggle('show', on); b.setAttribute('aria-expanded', on);
  if(on && typeof force !== 'boolean'){ var f = m.querySelector('[role=menuitem]'); if(f) f.focus(); }
}
document.addEventListener('click', function(e){ if(!e.target.closest('.profile')) toggleMenu(false); });
/* profile menu: menu pattern (Ani, 7 Oct: Switch portal). Arrow keys, Home/End move; Escape closes (handled above); Tab closes */
function menuItems(){ return Array.prototype.slice.call(document.querySelectorAll('#profile-menu [role=menuitem]')); }
document.getElementById('profile-menu').addEventListener('keydown', function(e){
  var it = menuItems(), i = it.indexOf(document.activeElement), k = e.key;
  if(k === 'ArrowDown' || k === 'ArrowUp'){ e.preventDefault(); it[(i + (k === 'ArrowDown' ? 1 : -1) + it.length) % it.length].focus(); }
  else if(k === 'Home' || k === 'End'){ e.preventDefault(); it[k === 'Home' ? 0 : it.length - 1].focus(); }
  else if(k === 'Tab'){ toggleMenu(false); }
  else if(k === ' ' && document.activeElement.tagName === 'A'){ e.preventDefault(); document.activeElement.click(); }
});
document.getElementById('profile-btn').addEventListener('keydown', function(e){
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); toggleMenu(true); var it = menuItems(); it[e.key === 'ArrowDown' ? 0 : it.length - 1].focus(); }
});

var toastT;
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('show'); }, 4200); }
function renderAll(){ renderQueue(); renderRemit(); }

document.getElementById('tb-cut').textContent = 'Next close-off ' + fdw(NEXT_RUN[0]) + ', 7 PM';
document.getElementById('tb-pay').textContent = 'Paid ' + fdw(NEXT_RUN[1]);
document.getElementById('h-queue-tip').outerHTML = tip('Refused and held MSP claims, and your questions to the doctor. You fix and resend; ' + DOC + ' decides the coding and approves write-offs.');
paint();
renderAll();
if(location.hash === '#remit') go('remit');
